<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=557,height=418,initial-scale=1.0">
  <title>Trinity Cricket Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 557px;
      height: 418px;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #scoreboard {
      position: relative;
      width: 557px;
      height: 418px;
      overflow: hidden;
      color: #fff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      text-shadow: 0 3px 7px rgba(0,0,0,1);
    }

    /* ---------------- HEADER ---------------- */

    .header {
      height: 106px;
      flex: 0 0 106px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 18px 13px 2px;
      text-align: center;
    }

    .main-title {
      width: 100%;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .competition-title {
      width: 100%;
      margin-top: 11px;

      font-size: 24px;
      line-height: 1;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------------- MATCH ---------------- */

    .match {
      height: 219px;
      flex: 0 0 219px;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        49px
        minmax(0, 1fr);

      align-items: center;
      padding: 8px 14px 0;
    }

    .team {
      min-width: 0;
      height: 176px;

      display: grid;
      grid-template-rows:
        58px
        76px
        42px;

      align-items: center;
      justify-items: center;
      text-align: center;
    }

    .team-name {
      width: 100%;
      height: 58px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 0 5px 6px;

      font-size: 22px;
      line-height: 1.05;
      font-weight: 900;

      text-align: center;
      white-space: normal;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .score {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 64px;
      line-height: 1;
      font-weight: 900;

      letter-spacing: -2.6px;
      white-space: nowrap;
      text-align: center;
    }

    .overs {
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .vs-column {
      height: 176px;

      display: grid;
      grid-template-rows:
        58px
        76px
        42px;
    }

    .vs {
      grid-row: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;
      font-weight: 900;
    }

    /* ---------------- LIVE INFO / RESULT ---------------- */

    .result {
      flex: 1;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding: 7px 16px 0;

      text-align: center;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 900;
    }


    /* ---------------- BOUNDARY CELEBRATIONS ---------------- */

    .boundary-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;

      /* Approved clean Trinity school-colour blend */
      background:
        radial-gradient(circle at 18% 20%, rgba(255,216,120,.18), transparent 28%),
        radial-gradient(circle at 78% 24%, rgba(141,27,60,.34), transparent 34%),
        radial-gradient(circle at 50% 78%, rgba(18,52,92,.72), transparent 48%),
        linear-gradient(
          135deg,
          #07192f 0%,
          #0d2d55 34%,
          #711a34 66%,
          #c89828 100%
        );
    }

    .boundary-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 48%, rgba(255,216,120,.22), transparent 28%),
        linear-gradient(
          135deg,
          rgba(7,25,47,.10),
          rgba(122,23,50,.20),
          rgba(242,193,78,.13)
        );
      opacity: 0;
      z-index: 2;
    }

    .boundary-overlay.show {
      display: flex;
      animation: boundaryOverlay 3.5s ease both;
    }

    .boundary-overlay.show::before {
      animation: celebrationWash 3.5s ease both;
    }

    .boundary-flash {
      position: absolute;
      inset: 0;
      z-index: 9;
      background: rgba(255,235,175,.95);
      opacity: 0;
      mix-blend-mode: screen;
    }

    .boundary-overlay.show .boundary-flash {
      animation: boundaryFlash 3.5s ease both;
    }

    .boundary-word {
      position: relative;
      z-index: 8;
      line-height: .9;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 1000;
      letter-spacing: -.05em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      transform: scale(.15);
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    /* FOUR: white, crisp, maroon border, gold edge — no fireworks */
    .boundary-overlay.four .boundary-word {
      font-size: 122px;
      color: #fffdf8;
      -webkit-text-stroke: 3px #711a34;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 #f2c14e,
        0 6px 0 #47101f,
        0 12px 24px rgba(0,0,0,.72),
        0 0 8px rgba(255,255,255,.35);

      animation: fourPop 3.5s cubic-bezier(.18,.9,.28,1) both;
    }

    /* SIX: intentionally larger and more dramatic */
    .boundary-overlay.six .boundary-word {
      font-size: 166px;
      color: #ffd878;
      -webkit-text-stroke: 4px #711a34;
      paint-order: stroke fill;
      text-shadow:
        0 3px 0 #f2c14e,
        0 8px 0 #47101f,
        0 16px 30px rgba(0,0,0,.76),
        0 0 16px rgba(242,193,78,.68);

      animation: sixPop 3.5s cubic-bezier(.15,.92,.2,1) both;
    }

    /* Real particle-style fireworks used ONLY for SIX */
    .fireworks-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .firework-burst {
      position: absolute;
      width: 2px;
      height: 2px;
    }

    .fw-main {
      left: 50%;
      top: 50%;
    }

    .fw-one {
      left: 28%;
      top: 32%;
    }

    .fw-two {
      left: 73%;
      top: 34%;
    }

    .fw-three {
      left: 34%;
      top: 69%;
    }

    .fw-four {
      left: 67%;
      top: 67%;
    }

    .firework-spark {
      --a: 0deg;
      --d: 170px;
      --delay: 0s;

      position: absolute;
      left: 0;
      top: 0;

      width: 5px;
      height: 5px;
      border-radius: 50%;

      background: #ffd878;
      box-shadow:
        0 0 6px #ffd878,
        0 0 14px #f2c14e;

      opacity: 0;
      transform: rotate(var(--a)) translateX(0) scale(.2);
      animation-delay: var(--delay);
    }

    .firework-spark.maroon {
      background: #e34d79;
      box-shadow:
        0 0 6px #e34d79,
        0 0 15px #8d1b3c;
    }

    .firework-spark.white {
      background: #fff7dd;
      box-shadow:
        0 0 7px #fff7dd,
        0 0 15px #f2c14e;
    }

    .firework-spark.small {
      width: 3px;
      height: 3px;
    }

    .firework-comet {
      --a: 0deg;
      --d: 150px;
      --delay: 0s;

      position: absolute;
      left: 0;
      top: 0;

      width: 58px;
      height: 2px;
      transform-origin: left center;

      background:
        linear-gradient(
          90deg,
          rgba(255,236,180,.98),
          rgba(242,193,78,.58),
          rgba(242,193,78,0)
        );

      opacity: 0;
      animation-delay: var(--delay);
    }

    .boundary-overlay.show.six .firework-spark {
      animation: fireworkSpark 3.5s cubic-bezier(.18,.8,.2,1) both;
    }

    .boundary-overlay.show.six .firework-comet {
      animation: fireworkComet 3.5s ease-out both;
    }

    @keyframes boundaryOverlay {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      90%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes celebrationWash {
      0%   { opacity: 0; }
      7%   { opacity: .92; }
      72%  { opacity: .78; }
      100% { opacity: 0; }
    }

    @keyframes boundaryFlash {
      0%, 4%   { opacity: 0; }
      6%       { opacity: .80; }
      8%       { opacity: 0; }
      14%      { opacity: .26; }
      16%      { opacity: 0; }
      24%      { opacity: .16; }
      26%,100% { opacity: 0; }
    }

    @keyframes fourPop {
      0%   { opacity: 0; transform: scale(.15); }
      6%   { opacity: 1; transform: scale(1.28); }
      11%  { transform: scale(.90); }
      17%  { transform: scale(1.10); }
      24%  { transform: scale(.98); }
      32%  { transform: scale(1); }
      73%  { opacity: 1; transform: scale(1); }
      82%  { transform: scale(1.06); }
      100% { opacity: 0; transform: scale(.90); }
    }

    @keyframes sixPop {
      0%   { opacity: 0; transform: scale(.08); }
      5%   { opacity: 1; transform: scale(1.48); }
      10%  { transform: scale(.84); }
      16%  { transform: scale(1.20); }
      22%  { transform: scale(.96); }
      30%  { transform: scale(1.08); }
      36%  { opacity: 1; transform: scale(1.04); }
      72%  { opacity: 1; transform: scale(1.04); }
      80%  { transform: scale(1.12); }
      100% { opacity: 0; transform: scale(.90); }
    }

    @keyframes fireworkSpark {
      0%, 7% {
        opacity: 0;
        transform: rotate(var(--a)) translateX(0) scale(.2);
      }

      10% {
        opacity: 1;
      }

      34% {
        opacity: 1;
        transform: rotate(var(--a)) translateX(var(--d)) scale(1);
      }

      62% {
        opacity: .85;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * 1.24))
          translateY(8px)
          scale(.7);
      }

      100% {
        opacity: 0;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * 1.50))
          translateY(24px)
          scale(.1);
      }
    }

    @keyframes fireworkComet {
      0%, 6% {
        opacity: 0;
        transform: rotate(var(--a)) translateX(0) scaleX(.2);
      }

      9% {
        opacity: 1;
      }

      30% {
        opacity: .85;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * .55))
          scaleX(1);
      }

      65% {
        opacity: .4;
        transform:
          rotate(var(--a))
          translateX(var(--d))
          scaleX(.8);
      }

      100% {
        opacity: 0;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * 1.28))
          scaleX(.25);
      }
    }
  </style>
</head>

<body>

  <div id="scoreboard">


    <!-- Full-screen FOUR / SIX celebration overlay -->
    <div id="boundaryOverlay" class="boundary-overlay" aria-hidden="true">

      <div class="boundary-flash"></div>

      <!-- Fireworks are dynamically created only when a SIX is detected -->
      <div class="fireworks-layer" aria-hidden="true">
        <div id="fwMain" class="firework-burst fw-main"></div>
        <div id="fwOne" class="firework-burst fw-one"></div>
        <div id="fwTwo" class="firework-burst fw-two"></div>
        <div id="fwThree" class="firework-burst fw-three"></div>
        <div id="fwFour" class="firework-burst fw-four"></div>
      </div>

      <div id="boundaryWord" class="boundary-word"></div>

    </div>

    <div class="content">

      <div class="header">

        <div
          class="main-title"
          id="mainTitle"
        >
          2026 Trinity Games
        </div>

        <div
          class="competition-title"
          id="competitionTitle"
        >
          LIVE CRICKET
        </div>
</div>


      <div class="match">

        <div class="team">

          <div
            class="team-name"
            id="team1Name"
          >
            Loading...
          </div>

          <div
            class="score"
            id="team1Score"
          >
            --
          </div>

          <div
            class="overs"
            id="team1Overs"
          >
            -- overs
          </div>

        </div>


        <div class="vs-column">

          <div class="vs">
            VS
          </div>

        </div>


        <div class="team">

          <div
            class="team-name"
            id="team2Name"
          >
            Loading...
          </div>

          <div
            class="score"
            id="team2Score"
          >
            --
          </div>

          <div
            class="overs"
            id="team2Overs"
          >
            -- overs
          </div>

        </div>

      </div>


      <div
        class="result"
        id="status"
      ></div>

    </div>

  </div>


  <script>

    const CONFIG_URL = "/api";
    const UPDATE_INTERVAL_MS = 5000;

    let CLUB_ID = null;
    let MATCH_ID = null;
    let HAS_VALID_MATCH = false;

    let CURRENT_BACKGROUND = "Stadium Night";
    let CUSTOM_BACKGROUND_URL = "";


    function firstValue(obj, keys) {

      for (const key of keys) {

        const value = obj?.[key];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {
          return value;
        }
      }

      return "";
    }


    function walk(obj, callback) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {
        return;
      }

      callback(obj);

      if (Array.isArray(obj)) {

        for (const item of obj) {
          walk(item, callback);
        }

      } else {

        for (const value of Object.values(obj)) {
          walk(value, callback);
        }
      }
    }


    function extractMatchDetails(matchUrl) {

      if (!matchUrl) {
        return null;
      }

      const text = String(matchUrl).trim();

      const clubMatch =
        text.match(/[?&]clubId=(\d+)/i);

      const matchMatch =
        text.match(/[?&]matchId=(\d+)/i);

      if (
        !clubMatch ||
        !matchMatch
      ) {
        return null;
      }

      return {
        clubId: clubMatch[1],
        matchId: matchMatch[1]
      };
    }


    function convertImageUrl(url) {

      if (!url) {
        return "";
      }

      const value =
        String(url).trim();

      const fileMatch =
        value.match(/\/file\/d\/([^/]+)/);

      if (fileMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w1600`
        );
      }

      const queryMatch =
        value.match(/[?&]id=([^&]+)/);

      if (queryMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${queryMatch[1]}&sz=w1600`
        );
      }

      return value;
    }


    function applyBackground(
      name,
      customUrl
    ) {

      const board =
        document.getElementById(
          "scoreboard"
        );

      if (
        name === "Custom" &&
        customUrl
      ) {

        const imageUrl =
          convertImageUrl(
            customUrl
          );

        board.style.backgroundImage =
          `
          linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.48)
          ),
          url("${imageUrl}")
          `;

        board.style.backgroundSize =
          "cover";

        board.style.backgroundPosition =
          "center";

        board.style.backgroundRepeat =
          "no-repeat";
      }
    }


    function findTeamHolder(data) {

      let holder = null;

      walk(
        data,
        (obj) => {

          if (holder) {
            return;
          }

          const hasTeam1 =
            obj?.team1Name ||
            obj?.teamOneName;

          const hasTeam2 =
            obj?.team2Name ||
            obj?.teamTwoName;

          if (
            hasTeam1 &&
            hasTeam2
          ) {
            holder = obj;
          }
        }
      );

      return holder;
    }


    function buildTeams(data) {

      const holder =
        findTeamHolder(data);

      if (!holder) {
        return [];
      }

      return [

        {
          teamName:
            holder.team1Name ??
            holder.teamOneName ??
            "",

          score:
            holder.team1Score ??
            holder.teamOneScore ??
            "",

          wickets:
            holder.team1Wickets ??
            holder.teamOneWickets ??
            "",

          overs:
            holder.team1Overs ??
            holder.teamOneOvers ??
            ""
        },

        {
          teamName:
            holder.team2Name ??
            holder.teamTwoName ??
            "",

          score:
            holder.team2Score ??
            holder.teamTwoScore ??
            "",

          wickets:
            holder.team2Wickets ??
            holder.teamTwoWickets ??
            "",

          overs:
            holder.team2Overs ??
            holder.teamTwoOvers ??
            ""
        }

      ];
    }


    function formatScore(team) {

      if (
        team.score === undefined ||
        team.score === null ||
        String(team.score).trim() === ""
      ) {
        return "--";
      }

      if (
        team.wickets !== undefined &&
        team.wickets !== null &&
        String(team.wickets).trim() !== ""
      ) {
        return `${team.score}/${team.wickets}`;
      }

      return String(team.score);
    }


    function formatOvers(team) {

      if (
        team.overs !== undefined &&
        team.overs !== null &&
        String(team.overs).trim() !== ""
      ) {
        return `${team.overs} overs`;
      }

      return "-- overs";
    }


    function findCompetitionTitle(data) {

      let title = "";

      walk(
        data,
        (obj) => {

          if (title) {
            return;
          }

          title =
            firstValue(
              obj,
              [
                "matchName",
                "fixtureName",
                "seriesName",
                "leagueName",
                "tournamentName"
              ]
            );
        }
      );

      if (!title) {
        return "LIVE CRICKET";
      }

      const text =
        String(title).trim();

      const parts =
        text.split("-");

      if (parts.length >= 2) {

        return (
          parts
            .slice(1)
            .join("-")
            .trim()
        );
      }

      return text;
    }


    function findFinalResult(data) {

      let finalResult = "";

      walk(
        data,
        (obj) => {

          if (finalResult) {
            return;
          }

          const possibleResult =
            firstValue(
              obj,
              [
                "result",
                "resultText",
                "matchResult"
              ]
            );

          if (
            possibleResult &&
            /won by|won the match|tied|drawn|abandoned|no result/i.test(
              String(possibleResult)
            )
          ) {
            finalResult =
              String(possibleResult);
          }
        }
      );

      return finalResult;
    }


    function findCurrentInnings(
      scoreData
    ) {

      let currentInnings = null;

      walk(
        scoreData,
        (obj) => {

          if (
            currentInnings !== null
          ) {
            return;
          }

          const value =
            obj?.currentInnings;

          if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number)
            ) {
              currentInnings = number;
            }
          }
        }
      );

      return currentInnings;
    }


    function oversToBalls(
      oversValue
    ) {

      if (
        oversValue === undefined ||
        oversValue === null
      ) {
        return 0;
      }

      const text =
        String(oversValue).trim();

      const parts =
        text.split(".");

      const completedOvers =
        Number(parts[0] || 0);

      const ballsInOver =
        Number(parts[1] || 0);

      return (
        completedOvers * 6
      ) + ballsInOver;
    }


    function ballsToOvers(
      balls
    ) {

      const safeBalls =
        Math.max(
          0,
          Math.floor(balls)
        );

      const overs =
        Math.floor(
          safeBalls / 6
        );

      const ballsRemaining =
        safeBalls % 6;

      return `${overs}.${ballsRemaining}`;
    }


    function findOversLimit(
      scoreData
    ) {

      let oversLimit = null;

      walk(
        scoreData,
        (obj) => {

          if (
            oversLimit !== null
          ) {
            return;
          }

          const values = [
            obj?.matchOvers,
            obj?.totalOvers,
            obj?.maxOvers,
            obj?.oversLimit,
            obj?.noOfOvers
          ];

          for (
            const value
            of values
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number) &&
              number > 0
            ) {
              oversLimit = number;
              return;
            }
          }

          const text =
            String(
              obj?.matchResult ||
              ""
            );

          const match =
            text.match(
              /\/\s*(\d+(?:\.\d+)?)\s*ov/i
            );

          if (match?.[1]) {

            const number =
              Number(match[1]);

            if (
              Number.isFinite(number)
            ) {
              oversLimit = number;
            }
          }
        }
      );

      return oversLimit;
    }


    function getFirstInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      if (!innings1) {
        return "";
      }

      const runs =
        Number(innings1.runs);

      const balls =
        oversToBalls(
          innings1.overs
        );

      if (
        !Number.isFinite(runs) ||
        balls <= 0
      ) {
        return "";
      }

      const exactRunRate =
        (
          runs * 6
        ) /
        balls;

      const displayedRunRate =
        Number(
          exactRunRate.toFixed(1)
        );

      if (
        !Number.isFinite(
          displayedRunRate
        )
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {
        return `CRR: ${displayedRunRate.toFixed(1)}`;
      }

      const projectedScore =
        Math.round(
          displayedRunRate *
          oversLimit
        );

      return (
        `PROJECTED SCORE : ${projectedScore} RUNS (CRR:${displayedRunRate.toFixed(1)})`
      );
    }


    function getSecondInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        !innings1 ||
        !innings2
      ) {
        return "";
      }

      const firstInningsRuns =
        Number(
          innings1.runs
        );

      const secondInningsRuns =
        Number(
          innings2.runs
        );

      if (
        !Number.isFinite(
          firstInningsRuns
        ) ||
        !Number.isFinite(
          secondInningsRuns
        )
      ) {
        return "";
      }

      const target =
        firstInningsRuns + 1;

      const runsNeeded =
        Math.max(
          0,
          target -
          secondInningsRuns
        );

      if (
        runsNeeded <= 0
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {
        return `${runsNeeded} runs needed`;
      }

      const ballsUsed =
        oversToBalls(
          innings2.overs
        );

      const totalBalls =
        oversLimit * 6;

      const ballsRemaining =
        Math.max(
          0,
          totalBalls -
          ballsUsed
        );

      let wicketsLost = 0;

      const rcb =
        String(
          innings2.rcb ||
          ""
        );

      const wicketMatch =
        rcb.match(
          /\/\s*(\d+)/
        );

      if (
        wicketMatch?.[1]
      ) {
        wicketsLost =
          Number(
            wicketMatch[1]
          );
      }

      const wicketsRemaining =
        Math.max(
          0,
          10 -
          wicketsLost
        );

      const oversRemaining =
        ballsToOvers(
          ballsRemaining
        );

      const requiredRunRate =
        ballsRemaining > 0
          ? (
              runsNeeded * 6
            ) /
            ballsRemaining
          : null;

      const rrrText =
        Number.isFinite(
          requiredRunRate
        )
          ? requiredRunRate.toFixed(2)
          : "--";

      return (
        `${runsNeeded} runs needed in ${oversRemaining} overs (${ballsRemaining} balls) with ${wicketsRemaining} wickets remaining. RRR: ${rrrText}`
      );
    }


    function getBottomText(
      scoreData,
      ballsData
    ) {

      const finalResult =
        findFinalResult(
          scoreData
        );

      if (finalResult) {
        return finalResult;
      }

      const oversLimit =
        findOversLimit(
          scoreData
        );

      const currentInnings =
        findCurrentInnings(
          scoreData
        );

      if (
        currentInnings === 1
      ) {
        return (
          getFirstInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      if (
        currentInnings === 2
      ) {
        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        innings2 &&
        Number(
          innings2.runs
        ) > 0
      ) {
        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      return (
        getFirstInningsText(
          ballsData,
          oversLimit
        )
      );
    }


    async function loadConfig() {

      const response =
        await fetch(
          `${CONFIG_URL}?t=${Date.now()}`,
          {
            cache:
              "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          `Config HTTP ${response.status}`
        );
      }

      const config =
        await response.json();

      const details =
        extractMatchDetails(
          config[
            "CricClubs Match URL"
          ] ||
          ""
        );

      if (details) {

        CLUB_ID =
          details.clubId;

        MATCH_ID =
          details.matchId;

        HAS_VALID_MATCH =
          true;
      }

      CURRENT_BACKGROUND =
        config[
          "Background"
        ] ||
        CURRENT_BACKGROUND;

      CUSTOM_BACKGROUND_URL =
        config[
          "Custom Background URL"
        ] ||
        CUSTOM_BACKGROUND_URL;

      applyBackground(
        CURRENT_BACKGROUND,
        CUSTOM_BACKGROUND_URL
      );
    }




    /* =========================================
       FOUR / SIX ANIMATION DETECTION
       ========================================= */

    const SEEN_DELIVERY_KEYS = new Set();
    let BOUNDARY_BASELINE_READY = false;
    let BOUNDARY_ANIMATION_ACTIVE = false;
    let BOUNDARY_HIDE_TIMER = null;

    function deliveryKey(ball) {
      const createdAt = firstValue(ball, ["createdAt", "lastModifiedAt", "timestamp", "time"]);
      const over = firstValue(ball, ["over", "overNum", "overNumber"]);
      const delivery = firstValue(ball, ["ball", "ballNum", "ballNumber"]);
      const batsman = firstValue(ball, ["batsmanName", "strikerName", "batsman"]);
      const runs = firstValue(ball, ["runs", "runsScored", "runsDisplay"]);
      const commentary = firstValue(ball, ["commentary", "description"]);
      return [createdAt, over, delivery, batsman, runs, commentary].join("|");
    }

    function collectDeliveries(ballsData) {
      const deliveries = [];

      walk(ballsData, (obj) => {
        if (!obj || typeof obj !== "object" || Array.isArray(obj)) return;

        const hasBallShape =
          obj.createdAt !== undefined &&
          (
            obj.ball !== undefined ||
            obj.ballType !== undefined ||
            obj.batsmanName !== undefined ||
            obj.strikerName !== undefined ||
            obj.commentary !== undefined
          ) &&
          (
            obj.runs !== undefined ||
            obj.runsScored !== undefined ||
            obj.runsDisplay !== undefined
          );

        if (!hasBallShape) return;

        const rawRuns = firstValue(obj, ["runs", "runsScored", "runsDisplay"]);
        const runs = Number(String(rawRuns).replace(/[^0-9.-]/g, ""));
        if (!Number.isFinite(runs)) return;

        deliveries.push({
          key: deliveryKey(obj),
          runs,
          createdAt: String(obj.createdAt || ""),
          raw: obj
        });
      });

      deliveries.sort((a, b) => {
        const ta = Date.parse(a.createdAt);
        const tb = Date.parse(b.createdAt);
        if (Number.isFinite(ta) && Number.isFinite(tb) && ta !== tb) return ta - tb;
        return a.key.localeCompare(b.key);
      });

      return deliveries;
    }


    function clearSixFireworks() {
      [
        "fwMain",
        "fwOne",
        "fwTwo",
        "fwThree",
        "fwFour"
      ].forEach(id => {
        const holder = document.getElementById(id);
        if (holder) holder.innerHTML = "";
      });
    }

    function addFireworkBurst(holderId, count, baseDistance, delayBase = 0) {
      const holder = document.getElementById(holderId);
      if (!holder) return;

      holder.innerHTML = "";

      for (let i = 0; i < count; i++) {
        const spark = document.createElement("span");

        const colourClass =
          i % 3 === 1
            ? " maroon"
            : i % 3 === 2
              ? " white"
              : "";

        spark.className =
          "firework-spark" +
          colourClass +
          (i % 4 === 0 ? " small" : "");

        const angle =
          (360 / count) * i +
          (Math.random() * 7 - 3.5);

        const distance =
          baseDistance *
          (.72 + Math.random() * .50);

        spark.style.setProperty(
          "--a",
          `${angle}deg`
        );

        spark.style.setProperty(
          "--d",
          `${distance}px`
        );

        spark.style.setProperty(
          "--delay",
          `${delayBase + Math.random() * .08}s`
        );

        holder.appendChild(spark);
      }

      const cometCount =
        Math.max(
          8,
          Math.round(count / 4)
        );

      for (let i = 0; i < cometCount; i++) {
        const comet =
          document.createElement("span");

        comet.className =
          "firework-comet";

        const angle =
          (360 / cometCount) * i +
          (Math.random() * 8 - 4);

        const distance =
          baseDistance *
          (.72 + Math.random() * .30);

        comet.style.setProperty(
          "--a",
          `${angle}deg`
        );

        comet.style.setProperty(
          "--d",
          `${distance}px`
        );

        comet.style.setProperty(
          "--delay",
          `${delayBase + Math.random() * .05}s`
        );

        holder.appendChild(comet);
      }
    }

    function buildSixFireworks() {
      clearSixFireworks();

      /* Main explosion */
      addFireworkBurst(
        "fwMain",
        72,
        225,
        0
      );

      /* Staggered secondary explosions */
      addFireworkBurst(
        "fwOne",
        28,
        86,
        .10
      );

      addFireworkBurst(
        "fwTwo",
        28,
        86,
        .14
      );

      addFireworkBurst(
        "fwThree",
        22,
        74,
        .18
      );

      addFireworkBurst(
        "fwFour",
        22,
        74,
        .21
      );
    }


    function showBoundaryAnimation(runs) {
      if (runs !== 4 && runs !== 6) return;

      const overlay =
        document.getElementById(
          "boundaryOverlay"
        );

      const word =
        document.getElementById(
          "boundaryWord"
        );

      if (!overlay || !word) return;

      if (BOUNDARY_HIDE_TIMER) {
        clearTimeout(
          BOUNDARY_HIDE_TIMER
        );

        BOUNDARY_HIDE_TIMER =
          null;
      }

      BOUNDARY_ANIMATION_ACTIVE =
        true;

      /*
        Reset the previous animation completely.
        This allows another boundary to animate
        even if it follows quickly.
      */
      overlay.className =
        "boundary-overlay";

      clearSixFireworks();

      void overlay.offsetWidth;

      if (runs === 4) {
        word.textContent =
          "FOUR";

        /*
          FOUR:
          white + maroon/gold outline,
          pop/flash only,
          NO fireworks.
        */
        overlay.classList.add(
          "show",
          "four"
        );
      }

      else {
        word.textContent =
          "SIX";

        /*
          SIX:
          larger gold lettering,
          stronger pop,
          full fireworks explosion.
        */
        buildSixFireworks();

        overlay.classList.add(
          "show",
          "six"
        );
      }

      /*
        Approved animation length:
        3.5 seconds.
      */
      BOUNDARY_HIDE_TIMER =
        setTimeout(
          () => {
            overlay.className =
              "boundary-overlay";

            word.textContent =
              "";

            clearSixFireworks();

            BOUNDARY_ANIMATION_ACTIVE =
              false;
          },
          3500
        );
    }

    function processBoundaryAnimations(ballsData) {
      const deliveries = collectDeliveries(ballsData);
      if (!deliveries.length) return;

      if (!BOUNDARY_BASELINE_READY) {
        for (const delivery of deliveries) {
          SEEN_DELIVERY_KEYS.add(delivery.key);
        }
        BOUNDARY_BASELINE_READY = true;
        return;
      }

      const unseen = deliveries.filter(d => !SEEN_DELIVERY_KEYS.has(d.key));

      for (const delivery of deliveries) {
        SEEN_DELIVERY_KEYS.add(delivery.key);
      }

      while (SEEN_DELIVERY_KEYS.size > 300) {
        const oldest = SEEN_DELIVERY_KEYS.values().next().value;
        SEEN_DELIVERY_KEYS.delete(oldest);
      }

      if (!unseen.length) return;

      const latestBoundary = [...unseen].reverse().find(d => d.runs === 4 || d.runs === 6);
      if (latestBoundary) {
        showBoundaryAnimation(latestBoundary.runs);
      }
    }


    async function loadScore() {

      if (
        !HAS_VALID_MATCH ||
        !CLUB_ID ||
        !MATCH_ID
      ) {
        return;
      }

      try {

        const [
          scoreResponse,
          ballsResponse
        ] =
          await Promise.all(
            [
              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              ),

              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}/balls?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              )
            ]
          );

        if (!scoreResponse.ok) {

          throw new Error(
            `Score HTTP ${scoreResponse.status}`
          );
        }

        if (!ballsResponse.ok) {

          throw new Error(
            `Balls HTTP ${ballsResponse.status}`
          );
        }

        const scoreData =
          await scoreResponse.json();

        const ballsData =
          await ballsResponse.json();


        processBoundaryAnimations(
          ballsData
        );

        const teams =
          buildTeams(
            scoreData
          );

        if (
          teams.length < 2
        ) {
          return;
        }

        const team1 =
          teams[0];

        const team2 =
          teams[1];

        document.getElementById(
          "mainTitle"
        ).textContent =
          "2026 Trinity Games";

        document.getElementById(
          "competitionTitle"
        ).textContent =
          findCompetitionTitle(
            scoreData
          );

        document.getElementById(
          "team1Name"
        ).textContent =
          team1.teamName ||
          "TEAM 1";

        document.getElementById(
          "team2Name"
        ).textContent =
          team2.teamName ||
          "TEAM 2";

        document.getElementById(
          "team1Score"
        ).textContent =
          formatScore(
            team1
          );

        document.getElementById(
          "team2Score"
        ).textContent =
          formatScore(
            team2
          );

        document.getElementById(
          "team1Overs"
        ).textContent =
          formatOvers(
            team1
          );

        document.getElementById(
          "team2Overs"
        ).textContent =
          formatOvers(
            team2
          );

        document.getElementById(
          "status"
        ).textContent =
          getBottomText(
            scoreData,
            ballsData
          );

      }

      catch (error) {

        console.error(
          "Score error:",
          error
        );
      }
    }


    async function updateScoreboard() {

      try {

        await loadConfig();

      }

      catch (error) {

        console.error(
          "Config error:",
          error
        );
      }

      await loadScore();
    }


    updateScoreboard();


    setInterval(
      updateScoreboard,
      UPDATE_INTERVAL_MS
    );

  </script>
