<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=557,height=418,initial-scale=1.0"
  >

  <title>Trinity Cricket Scoreboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 557px;
      height: 418px;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    #scoreboard {
      position: relative;

      width: 557px;
      height: 418px;

      overflow: hidden;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    .stadium {
      position: absolute;
      inset: 0;

      overflow: hidden;

      pointer-events: none;
    }


    .stadium::before {
      content: "";

      position: absolute;

      left: -43px;
      right: -43px;

      top: 138px;
      height: 121px;

      background:
        linear-gradient(
          to bottom,
          rgba(5,7,9,0.20),
          rgba(0,0,0,0.72)
        );

      clip-path:
        polygon(
          0 20%,
          16% 31%,
          30% 22%,
          50% 37%,
          70% 22%,
          84% 31%,
          100% 20%,
          100% 100%,
          0 100%
        );
    }


    .field {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 171px;

      background:
        linear-gradient(
          to bottom,
          rgba(39,93,39,0.48),
          rgba(14,54,21,0.92)
        );

      pointer-events: none;
    }


    .field::after {
      content: "";

      position: absolute;

      left: 215px;
      bottom: -14px;

      width: 128px;
      height: 160px;

      background:
        linear-gradient(
          to bottom,
          rgba(181,161,94,0.12),
          rgba(152,132,67,0.28)
        );

      clip-path:
        polygon(
          40% 0,
          60% 0,
          100% 100%,
          0 100%
        );
    }


    .content {
      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      text-shadow:
        0 3px 7px rgba(0,0,0,1);
    }


    /* =====================================
       TOP SECTION
       ===================================== */

    .header {
      height: 139px;
      flex: 0 0 139px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: flex-end;

      padding:
        0 13px 8px;

      text-align: center;
    }


    .main-title {
      width: 100%;

      font-size: 27px;
      line-height: 1;

      font-weight: 900;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .competition-title {
      width: 100%;

      margin-top: 10px;

      font-size: 23px;
      line-height: 1;

      font-weight: 900;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .match-date {
      width: 100%;

      margin-top: 10px;

      font-size: 19px;
      line-height: 1;

      font-weight: 900;

      text-align: center;

      white-space: nowrap;
    }


    /* =====================================
       MATCH SECTION
       ===================================== */

    .match {
      height: 183px;
      flex: 0 0 183px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        49px
        minmax(0, 1fr);

      align-items: end;

      padding:
        15px 14px 0;
    }


    .team {
      min-width: 0;

      height: 158px;

      display: grid;

      grid-template-rows:
        42px
        70px
        39px;

      align-items: center;

      justify-items: center;

      text-align: center;
    }


    .team-name {
      width: 100%;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 23px;
      line-height: 1;

      font-weight: 900;

      text-align: center;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .score {
      width: 100%;
      height: 70px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 61px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: -2.6px;

      white-space: nowrap;

      text-align: center;
    }


    .overs {
      height: 39px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;

      font-weight: 900;

      white-space: nowrap;
    }


    .vs-column {
      height: 158px;

      display: grid;

      grid-template-rows:
        42px
        70px
        39px;
    }


    .vs {
      grid-row: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;

      font-weight: 900;
    }


    /* =====================================
       RESULT
       ===================================== */

    .result {
      flex: 1;

      display: flex;

      align-items: flex-start;
      justify-content: center;

      padding:
        6px 22px 0;

      text-align: center;

      font-size: 29px;
      line-height: 1.05;

      font-weight: 900;
    }


    .error {
      color: #ffc2c2;
    }

  </style>

</head>


<body>

  <div id="scoreboard">


    <div
      class="stadium"
      id="stadiumOverlay"
    ></div>


    <div
      class="field"
      id="fieldOverlay"
    ></div>


    <div class="content">


      <div class="header">


        <div
          class="main-title"
          id="mainTitle"
        >
          2026 Trinity Games
        </div>


        <div
          class="competition-title"
          id="competitionTitle"
        >
          LIVE CRICKET
        </div>


        <div
          class="match-date"
          id="matchDate"
        >
          LIVE
        </div>


      </div>


      <div class="match">


        <div class="team">


          <div
            class="team-name"
            id="team1Name"
          >
            Loading...
          </div>


          <div
            class="score"
            id="team1Score"
          >
            --
          </div>


          <div
            class="overs"
            id="team1Overs"
          >
            -- overs
          </div>


        </div>


        <div class="vs-column">

          <div class="vs">
            VS
          </div>

        </div>


        <div class="team">


          <div
            class="team-name"
            id="team2Name"
          >
            Loading...
          </div>


          <div
            class="score"
            id="team2Score"
          >
            --
          </div>


          <div
            class="overs"
            id="team2Overs"
          >
            -- overs
          </div>


        </div>


      </div>


      <div
        class="result"
        id="status"
      >
        Waiting for match...
      </div>


    </div>

  </div>


  <script>


    const CONFIG_URL = "/api";

    const UPDATE_INTERVAL_MS = 5000;


    let CLUB_ID = null;
    let MATCH_ID = null;

    let HAS_VALID_MATCH = false;

    let CURRENT_BACKGROUND =
      "Stadium Night";

    let CUSTOM_BACKGROUND_URL =
      "";


    function firstValue(
      obj,
      keys
    ) {

      for (
        const key
        of keys
      ) {

        const value =
          obj?.[key];


        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {

          return value;

        }

      }


      return "";

    }


    function walk(
      obj,
      callback
    ) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {

        return;

      }


      callback(obj);


      if (
        Array.isArray(obj)
      ) {

        for (
          const item
          of obj
        ) {

          walk(
            item,
            callback
          );

        }

      }

      else {

        for (
          const value
          of Object.values(obj)
        ) {

          walk(
            value,
            callback
          );

        }

      }

    }


    function extractMatchDetails(
      matchUrl
    ) {

      if (
        !matchUrl
      ) {

        return null;

      }


      const text =
        String(
          matchUrl
        ).trim();


      const clubMatch =
        text.match(
          /[?&]clubId=(\d+)/i
        );


      const matchMatch =
        text.match(
          /[?&]matchId=(\d+)/i
        );


      if (
        !clubMatch ||
        !matchMatch
      ) {

        return null;

      }


      return {

        clubId:
          clubMatch[1],

        matchId:
          matchMatch[1]

      };

    }


    function convertImageUrl(
      url
    ) {

      if (
        !url
      ) {

        return "";

      }


      const value =
        String(
          url
        ).trim();


      const fileMatch =
        value.match(
          /\/file\/d\/([^/]+)/
        );


      if (
        fileMatch?.[1]
      ) {

        return (
          `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w1600`
        );

      }


      const queryMatch =
        value.match(
          /[?&]id=([^&]+)/
        );


      if (
        queryMatch?.[1]
      ) {

        return (
          `https://drive.google.com/thumbnail?id=${queryMatch[1]}&sz=w1600`
        );

      }


      return value;

    }


    function applyBackground(
      name,
      customUrl
    ) {

      const board =
        document.getElementById(
          "scoreboard"
        );


      const stadium =
        document.getElementById(
          "stadiumOverlay"
        );


      const field =
        document.getElementById(
          "fieldOverlay"
        );


      if (
        name === "Custom" &&
        customUrl
      ) {

        const imageUrl =
          convertImageUrl(
            customUrl
          );


        board.style.backgroundImage =
          `
          linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.48)
          ),
          url("${imageUrl}")
          `;


        board.style.backgroundSize =
          "cover";


        board.style.backgroundPosition =
          "center";


        board.style.backgroundRepeat =
          "no-repeat";


        stadium.style.display =
          "none";


        field.style.display =
          "none";


        return;

      }


      stadium.style.display =
        "block";


      field.style.display =
        "block";


      if (
        name === "Plain Dark"
      ) {

        board.style.background =
          "linear-gradient(to bottom, #05070a, #0b0e13)";

      }


      else if (
        name === "Trinity Blue"
      ) {

        board.style.background =
          "linear-gradient(to bottom, #071b3a, #0b315f)";

      }


      else if (
        name === "Stadium Day"
      ) {

        board.style.background =
          "linear-gradient(to bottom, #79a9c9 0%, #769d65 55%, #2d6b34 100%)";

      }


      else {

        board.style.background =
          `
          radial-gradient(
            circle at 7% 13%,
            rgba(255,255,255,0.25) 0,
            rgba(255,255,255,0.08) 5%,
            transparent 15%
          ),
          radial-gradient(
            circle at 93% 13%,
            rgba(255,255,255,0.25) 0,
            rgba(255,255,255,0.08) 5%,
            transparent 15%
          ),
          linear-gradient(
            to bottom,
            #070b0f 0%,
            #111719 33%,
            #14271b 62%,
            #0b2412 100%
          )
          `;

      }

    }


    function findTeamHolder(
      data
    ) {

      let holder =
        null;


      walk(
        data,
        (obj) => {

          if (
            holder
          ) {

            return;

          }


          const hasTeam1 =
            obj?.team1Name ||
            obj?.teamOneName;


          const hasTeam2 =
            obj?.team2Name ||
            obj?.teamTwoName;


          if (
            hasTeam1 &&
            hasTeam2
          ) {

            holder =
              obj;

          }

        }
      );


      return holder;

    }


    function buildTeams(
      data
    ) {

      const holder =
        findTeamHolder(
          data
        );


      if (
        !holder
      ) {

        return [];

      }


      return [

        {

          teamName:
            holder.team1Name ??
            holder.teamOneName ??
            "",


          score:
            holder.team1Score ??
            holder.teamOneScore ??
            "",


          wickets:
            holder.team1Wickets ??
            holder.teamOneWickets ??
            "",


          overs:
            holder.team1Overs ??
            holder.teamOneOvers ??
            ""

        },


        {

          teamName:
            holder.team2Name ??
            holder.teamTwoName ??
            "",


          score:
            holder.team2Score ??
            holder.teamTwoScore ??
            "",


          wickets:
            holder.team2Wickets ??
            holder.teamTwoWickets ??
            "",


          overs:
            holder.team2Overs ??
            holder.teamTwoOvers ??
            ""

        }

      ];

    }


    function formatScore(
      team
    ) {

      if (
        team.score === undefined ||
        team.score === null ||
        String(team.score).trim() === ""
      ) {

        return "--";

      }


      if (
        team.wickets !== undefined &&
        team.wickets !== null &&
        String(team.wickets).trim() !== ""
      ) {

        return (
          `${team.score}/${team.wickets}`
        );

      }


      return String(
        team.score
      );

    }


    function formatOvers(
      team
    ) {

      if (
        team.overs !== undefined &&
        team.overs !== null &&
        String(team.overs).trim() !== ""
      ) {

        return (
          `${team.overs} overs`
        );

      }


      return "-- overs";

    }


    function findRawMatchTitle(
      data
    ) {

      let title =
        "";


      walk(
        data,
        (obj) => {

          if (
            title
          ) {

            return;

          }


          title =
            firstValue(
              obj,
              [
                "matchName",
                "fixtureName",
                "seriesName",
                "leagueName",
                "tournamentName"
              ]
            );

        }
      );


      return title;

    }


    function findCompetitionTitle(
      data
    ) {

      const rawTitle =
        findRawMatchTitle(
          data
        );


      if (
        !rawTitle
      ) {

        return "LIVE CRICKET";

      }


      const text =
        String(
          rawTitle
        ).trim();


      const parts =
        text.split(
          "-"
        );


      if (
        parts.length >= 2
      ) {

        return (
          parts
            .slice(1)
            .join("-")
            .trim()
        );

      }


      if (
        text.toLowerCase() !==
        "2026 trinity games"
          .toLowerCase()
      ) {

        return text;

      }


      return "LIVE CRICKET";

    }


    function findMatchDate(
      data
    ) {

      let date =
        "";


      walk(
        data,
        (obj) => {

          if (
            date
          ) {

            return;

          }


          date =
            firstValue(
              obj,
              [
                "matchDate",
                "fixtureDate",
                "date"
              ]
            );

        }
      );


      return formatDate(
        date
      );

    }


    function formatDate(
      value
    ) {

      if (
        !value
      ) {

        return "LIVE";

      }


      const text =
        String(
          value
        ).trim();


      const slash =
        text.match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


      if (
        slash
      ) {

        const month =
          slash[1]
            .padStart(
              2,
              "0"
            );


        const day =
          slash[2]
            .padStart(
              2,
              "0"
            );


        return (
          `${day}/${month}/${slash[3]}`
        );

      }


      const iso =
        text.match(
          /^(\d{4})-(\d{2})-(\d{2})/
        );


      if (
        iso
      ) {

        return (
          `${iso[3]}/${iso[2]}/${iso[1]}`
        );

      }


      return text;

    }


    function findStatus(
      data
    ) {

      let result =
        "";


      walk(
        data,
        (obj) => {

          if (
            result
          ) {

            return;

          }


          result =
            firstValue(
              obj,
              [
                "result",
                "resultText",
                "matchResult",
                "status",
                "matchStatus",
                "chaseText"
              ]
            );

        }
      );


      return (
        result ||
        "MATCH IN PROGRESS"
      );

    }


    async function loadConfig() {

      const response =
        await fetch(

          `${CONFIG_URL}?t=${Date.now()}`,

          {
            cache:
              "no-store"
          }

        );


      if (
        !response.ok
      ) {

        throw new Error(
          `Config HTTP ${response.status}`
        );

      }


      const config =
        await response.json();


      const matchUrl =
        config[
          "CricClubs Match URL"
        ] || "";


      const details =
        extractMatchDetails(
          matchUrl
        );


      if (
        details
      ) {

        CLUB_ID =
          details.clubId;


        MATCH_ID =
          details.matchId;


        HAS_VALID_MATCH =
          true;

      }


      CURRENT_BACKGROUND =
        config[
          "Background"
        ] ||
        CURRENT_BACKGROUND;


      CUSTOM_BACKGROUND_URL =
        config[
          "Custom Background URL"
        ] ||
        CUSTOM_BACKGROUND_URL;


      applyBackground(
        CURRENT_BACKGROUND,
        CUSTOM_BACKGROUND_URL
      );

    }


    async function loadScore() {

      if (
        !HAS_VALID_MATCH ||
        !CLUB_ID ||
        !MATCH_ID
      ) {

        document.getElementById(
          "status"
        ).textContent =
          "Waiting for match...";


        return;

      }


      try {

        const response =
          await fetch(

            `/api/${CLUB_ID}/${MATCH_ID}?t=${Date.now()}`,

            {
              cache:
                "no-store"
            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        const teams =
          buildTeams(
            data
          );


        if (
          teams.length < 2
        ) {

          throw new Error(
            "Could not identify both teams"
          );

        }


        const team1 =
          teams[0];


        const team2 =
          teams[1];


        document.getElementById(
          "mainTitle"
        ).textContent =
          "2026 Trinity Games";


        document.getElementById(
          "competitionTitle"
        ).textContent =
          findCompetitionTitle(
            data
          );


        document.getElementById(
          "matchDate"
        ).textContent =
          findMatchDate(
            data
          );


        document.getElementById(
          "team1Name"
        ).textContent =
          team1.teamName ||
          "TEAM 1";


        document.getElementById(
          "team2Name"
        ).textContent =
          team2.teamName ||
          "TEAM 2";


        document.getElementById(
          "team1Score"
        ).textContent =
          formatScore(
            team1
          );


        document.getElementById(
          "team2Score"
        ).textContent =
          formatScore(
            team2
          );


        document.getElementById(
          "team1Overs"
        ).textContent =
          formatOvers(
            team1
          );


        document.getElementById(
          "team2Overs"
        ).textContent =
          formatOvers(
            team2
          );


        document.getElementById(
          "status"
        ).textContent =
          findStatus(
            data
          );

      }


      catch (
        error
      ) {

        console.error(
          "Score error:",
          error
        );

      }

    }


    async function updateScoreboard() {

      try {

        await loadConfig();

      }


      catch (
        error
      ) {

        console.error(
          "Google Sheet config error:",
          error
        );

      }


      await loadScore();

    }


    updateScoreboard();


    setInterval(
      updateScoreboard,
      UPDATE_INTERVAL_MS
    );


  </script>


</body>
