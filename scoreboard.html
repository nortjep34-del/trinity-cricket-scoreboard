<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=557,height=418,initial-scale=1.0">
  <title>Trinity Cricket Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 557px;
      height: 418px;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #scoreboard {
      position: relative;
      width: 557px;
      height: 418px;
      overflow: hidden;
      color: #fff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      text-shadow: 0 3px 7px rgba(0,0,0,1);
    }

    /* ---------------- HEADER ---------------- */

    .header {
      height: 106px;
      flex: 0 0 106px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 18px 13px 2px;
      text-align: center;
    }

    .main-title {
      width: 100%;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .competition-title {
      width: 100%;
      margin-top: 11px;

      font-size: 24px;
      line-height: 1;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------------- MATCH ---------------- */

    .match {
      height: 219px;
      flex: 0 0 219px;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        49px
        minmax(0, 1fr);

      align-items: center;
      padding: 8px 14px 0;
    }

    .team {
      min-width: 0;
      height: 176px;

      display: grid;
      grid-template-rows:
        58px
        76px
        42px;

      align-items: center;
      justify-items: center;
      text-align: center;
    }

    .team-name {
      width: 100%;
      height: 58px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 0 5px 6px;

      font-size: 22px;
      line-height: 1.05;
      font-weight: 900;

      text-align: center;
      white-space: normal;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .score {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 64px;
      line-height: 1;
      font-weight: 900;

      letter-spacing: -2.6px;
      white-space: nowrap;
      text-align: center;
    }

    .overs {
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .vs-column {
      height: 176px;

      display: grid;
      grid-template-rows:
        58px
        76px
        42px;
    }

    .vs {
      grid-row: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;
      font-weight: 900;
    }

    /* ---------------- LIVE INFO / RESULT ---------------- */

    .result {
      flex: 1;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding: 7px 16px 0;

      text-align: center;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 900;
    }

    /* ---------------- BOUNDARY CELEBRATIONS ---------------- */

    .boundary-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(circle at 50% 50%, rgba(245,183,52,0.17) 0%, transparent 36%),
        linear-gradient(145deg, rgba(5,20,46,0.99) 0%, rgba(80,13,34,0.99) 52%, rgba(5,20,46,0.99) 100%);

      opacity: 0;
    }

    .boundary-overlay.show {
      display: flex;
      animation: boundaryOverlay 2.5s ease both;
    }

    .boundary-word {
      position: relative;
      z-index: 8;

      font-size: 122px;
      line-height: 0.85;
      font-weight: 900;
      letter-spacing: -6px;

      color: #f5b734;
      text-transform: uppercase;
      text-align: center;

      -webkit-text-stroke: 2px #fff0b4;

      text-shadow:
        0 5px 0 #651127,
        0 10px 22px rgba(0,0,0,0.78),
        0 0 30px rgba(245,183,52,0.75);

      opacity: 0;
      transform: scale(0.18);
    }

    .boundary-overlay.four .boundary-word {
      animation: fourPop 2.5s cubic-bezier(.18,.9,.26,1.35) both;
    }

    .boundary-overlay.six .boundary-word {
      font-size: 136px;
      animation: sixPop 2.5s cubic-bezier(.15,.9,.24,1.25) both;
    }

    .boundary-flash {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: #f5b734;
      opacity: 0;
    }

    .boundary-overlay.show .boundary-flash {
      animation: screenFlash 2.5s linear both;
    }

    /* Firework bursts behind FOUR / SIX */
    .firework {
      position: absolute;
      z-index: 5;

      width: 250px;
      height: 250px;
      border-radius: 50%;

      opacity: 0;
      transform: scale(0.08) rotate(0deg);

      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(245,183,52,0.98) 0deg 3deg,
          transparent 3deg 18deg
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 0 15%,
          #000 16% 48%,
          transparent 49% 100%
        );

      mask:
        radial-gradient(
          circle,
          transparent 0 15%,
          #000 16% 48%,
          transparent 49% 100%
        );

      filter:
        drop-shadow(0 0 8px rgba(245,183,52,0.9))
        drop-shadow(0 0 18px rgba(245,183,52,0.55));
    }

    .firework::before,
    .firework::after {
      content: '';
      position: absolute;
      inset: 20%;
      border-radius: 50%;

      background:
        repeating-conic-gradient(
          from 9deg,
          rgba(117,17,44,0.98) 0deg 4deg,
          transparent 4deg 22deg
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 0 12%,
          #000 13% 49%,
          transparent 50% 100%
        );

      mask:
        radial-gradient(
          circle,
          transparent 0 12%,
          #000 13% 49%,
          transparent 50% 100%
        );
    }

    .firework::after {
      inset: 31%;
      background:
        repeating-conic-gradient(
          from 4deg,
          rgba(255,242,190,0.95) 0deg 5deg,
          transparent 5deg 30deg
        );
    }

    .fw-main {
      left: 50%;
      top: 51%;
      margin-left: -125px;
      margin-top: -125px;
    }

    .fw-left {
      width: 175px;
      height: 175px;
      left: 11%;
      top: 25%;
    }

    .fw-right {
      width: 185px;
      height: 185px;
      right: 9%;
      bottom: 18%;
    }

    .boundary-overlay.show .fw-main {
      animation: fireworkMain 2.5s ease-out both;
    }

    .boundary-overlay.show .fw-left {
      animation: fireworkSideA 2.5s ease-out both;
    }

    .boundary-overlay.show .fw-right {
      animation: fireworkSideB 2.5s ease-out both;
    }

    .spark-field {
      position: absolute;
      inset: 0;
      z-index: 6;
      opacity: 0;
      background:
        radial-gradient(circle at 18% 38%, #f5b734 0 2px, transparent 3px),
        radial-gradient(circle at 27% 68%, #fff2be 0 2px, transparent 3px),
        radial-gradient(circle at 37% 25%, #7a1734 0 3px, transparent 4px),
        radial-gradient(circle at 46% 76%, #f5b734 0 2px, transparent 3px),
        radial-gradient(circle at 58% 21%, #fff2be 0 2px, transparent 3px),
        radial-gradient(circle at 68% 66%, #7a1734 0 3px, transparent 4px),
        radial-gradient(circle at 78% 34%, #f5b734 0 2px, transparent 3px),
        radial-gradient(circle at 86% 57%, #fff2be 0 2px, transparent 3px);
    }

    .boundary-overlay.show .spark-field {
      animation: sparkField 2.5s ease-out both;
    }

    @keyframes boundaryOverlay {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      88%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fourPop {
      0%   { opacity: 0; transform: scale(0.18); }
      9%   { opacity: 1; transform: scale(1.20); }
      17%  { transform: scale(0.96); }
      26%  { transform: scale(1.07); }
      36%  { transform: scale(1); }
      54%  { transform: scale(1.05); filter: brightness(1.24); }
      64%  { transform: scale(1); filter: brightness(1); }
      88%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.12); }
    }

    @keyframes sixPop {
      0%   { opacity: 0; transform: scale(0.12) rotate(-3deg); }
      9%   { opacity: 1; transform: scale(1.28) rotate(2deg); }
      18%  { transform: scale(0.94) rotate(0deg); }
      28%  { transform: scale(1.09); }
      40%  { transform: scale(1); }
      56%  { transform: scale(1.09); filter: brightness(1.28); }
      69%  { transform: scale(1); filter: brightness(1); }
      88%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.20); }
    }

    @keyframes screenFlash {
      0%, 6%, 20%, 34%, 100% { opacity: 0; }
      8%  { opacity: 0.34; }
      22% { opacity: 0.14; }
      36% { opacity: 0.08; }
    }

    @keyframes fireworkMain {
      0%, 4% { opacity: 0; transform: scale(0.05) rotate(0deg); }
      12%    { opacity: 1; transform: scale(0.58) rotate(8deg); }
      28%    { opacity: 1; transform: scale(1.15) rotate(18deg); }
      48%    { opacity: 0.85; transform: scale(1.45) rotate(28deg); }
      72%    { opacity: 0.30; transform: scale(1.72) rotate(36deg); }
      100%   { opacity: 0; transform: scale(1.95) rotate(44deg); }
    }

    @keyframes fireworkSideA {
      0%, 13% { opacity: 0; transform: scale(0.06) rotate(-10deg); }
      21%     { opacity: 0.95; transform: scale(0.72) rotate(4deg); }
      43%     { opacity: 0.78; transform: scale(1.22) rotate(18deg); }
      70%     { opacity: 0.20; transform: scale(1.55) rotate(30deg); }
      100%    { opacity: 0; transform: scale(1.80) rotate(38deg); }
    }

    @keyframes fireworkSideB {
      0%, 20% { opacity: 0; transform: scale(0.06) rotate(10deg); }
      28%     { opacity: 0.95; transform: scale(0.70) rotate(-4deg); }
      49%     { opacity: 0.80; transform: scale(1.20) rotate(-16deg); }
      74%     { opacity: 0.22; transform: scale(1.52) rotate(-28deg); }
      100%    { opacity: 0; transform: scale(1.78) rotate(-36deg); }
    }

    @keyframes sparkField {
      0%, 9% { opacity: 0; transform: scale(0.82); }
      18%    { opacity: 1; transform: scale(1); }
      50%    { opacity: 0.75; transform: scale(1.08); }
      85%    { opacity: 0.18; transform: scale(1.18); }
      100%   { opacity: 0; transform: scale(1.25); }
    }

  </style>
</head>

<body>

  <div id="scoreboard">


    <!-- Full-screen FOUR / SIX celebration overlay -->
    <div id="boundaryOverlay" class="boundary-overlay" aria-hidden="true">
      <div class="boundary-flash"></div>
      <div class="firework fw-main"></div>
      <div class="firework fw-left"></div>
      <div class="firework fw-right"></div>
      <div class="spark-field"></div>
      <div id="boundaryWord" class="boundary-word"></div>
    </div>

    <div class="content">

      <div class="header">

        <div
          class="main-title"
          id="mainTitle"
        >
          2026 Trinity Games
        </div>

        <div
          class="competition-title"
          id="competitionTitle"
        >
          LIVE CRICKET
        </div>
</div>


      <div class="match">

        <div class="team">

          <div
            class="team-name"
            id="team1Name"
          >
            Loading...
          </div>

          <div
            class="score"
            id="team1Score"
          >
            --
          </div>

          <div
            class="overs"
            id="team1Overs"
          >
            -- overs
          </div>

        </div>


        <div class="vs-column">

          <div class="vs">
            VS
          </div>

        </div>


        <div class="team">

          <div
            class="team-name"
            id="team2Name"
          >
            Loading...
          </div>

          <div
            class="score"
            id="team2Score"
          >
            --
          </div>

          <div
            class="overs"
            id="team2Overs"
          >
            -- overs
          </div>

        </div>

      </div>


      <div
        class="result"
        id="status"
      ></div>

    </div>

  </div>


  <script>

    const CONFIG_URL = "/api";
    const UPDATE_INTERVAL_MS = 5000;

    let CLUB_ID = null;
    let MATCH_ID = null;
    let HAS_VALID_MATCH = false;

    let CURRENT_BACKGROUND = "Stadium Night";
    let CUSTOM_BACKGROUND_URL = "";


    function firstValue(obj, keys) {

      for (const key of keys) {

        const value = obj?.[key];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {
          return value;
        }
      }

      return "";
    }


    function walk(obj, callback) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {
        return;
      }

      callback(obj);

      if (Array.isArray(obj)) {

        for (const item of obj) {
          walk(item, callback);
        }

      } else {

        for (const value of Object.values(obj)) {
          walk(value, callback);
        }
      }
    }


    function extractMatchDetails(matchUrl) {

      if (!matchUrl) {
        return null;
      }

      const text = String(matchUrl).trim();

      const clubMatch =
        text.match(/[?&]clubId=(\d+)/i);

      const matchMatch =
        text.match(/[?&]matchId=(\d+)/i);

      if (
        !clubMatch ||
        !matchMatch
      ) {
        return null;
      }

      return {
        clubId: clubMatch[1],
        matchId: matchMatch[1]
      };
    }


    function convertImageUrl(url) {

      if (!url) {
        return "";
      }

      const value =
        String(url).trim();

      const fileMatch =
        value.match(/\/file\/d\/([^/]+)/);

      if (fileMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w1600`
        );
      }

      const queryMatch =
        value.match(/[?&]id=([^&]+)/);

      if (queryMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${queryMatch[1]}&sz=w1600`
        );
      }

      return value;
    }


    function applyBackground(
      name,
      customUrl
    ) {

      const board =
        document.getElementById(
          "scoreboard"
        );

      if (
        name === "Custom" &&
        customUrl
      ) {

        const imageUrl =
          convertImageUrl(
            customUrl
          );

        board.style.backgroundImage =
          `
          linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.48)
          ),
          url("${imageUrl}")
          `;

        board.style.backgroundSize =
          "cover";

        board.style.backgroundPosition =
          "center";

        board.style.backgroundRepeat =
          "no-repeat";
      }
    }


    function findTeamHolder(data) {

      let holder = null;

      walk(
        data,
        (obj) => {

          if (holder) {
            return;
          }

          const hasTeam1 =
            obj?.team1Name ||
            obj?.teamOneName;

          const hasTeam2 =
            obj?.team2Name ||
            obj?.teamTwoName;

          if (
            hasTeam1 &&
            hasTeam2
          ) {
            holder = obj;
          }
        }
      );

      return holder;
    }


    function buildTeams(data) {

      const holder =
        findTeamHolder(data);

      if (!holder) {
        return [];
      }

      return [

        {
          teamName:
            holder.team1Name ??
            holder.teamOneName ??
            "",

          score:
            holder.team1Score ??
            holder.teamOneScore ??
            "",

          wickets:
            holder.team1Wickets ??
            holder.teamOneWickets ??
            "",

          overs:
            holder.team1Overs ??
            holder.teamOneOvers ??
            ""
        },

        {
          teamName:
            holder.team2Name ??
            holder.teamTwoName ??
            "",

          score:
            holder.team2Score ??
            holder.teamTwoScore ??
            "",

          wickets:
            holder.team2Wickets ??
            holder.teamTwoWickets ??
            "",

          overs:
            holder.team2Overs ??
            holder.teamTwoOvers ??
            ""
        }

      ];
    }


    function formatScore(team) {

      if (
        team.score === undefined ||
        team.score === null ||
        String(team.score).trim() === ""
      ) {
        return "--";
      }

      if (
        team.wickets !== undefined &&
        team.wickets !== null &&
        String(team.wickets).trim() !== ""
      ) {
        return `${team.score}/${team.wickets}`;
      }

      return String(team.score);
    }


    function formatOvers(team) {

      if (
        team.overs !== undefined &&
        team.overs !== null &&
        String(team.overs).trim() !== ""
      ) {
        return `${team.overs} overs`;
      }

      return "-- overs";
    }


    function findCompetitionTitle(data) {

      let title = "";

      walk(
        data,
        (obj) => {

          if (title) {
            return;
          }

          title =
            firstValue(
              obj,
              [
                "matchName",
                "fixtureName",
                "seriesName",
                "leagueName",
                "tournamentName"
              ]
            );
        }
      );

      if (!title) {
        return "LIVE CRICKET";
      }

      const text =
        String(title).trim();

      const parts =
        text.split("-");

      if (parts.length >= 2) {

        return (
          parts
            .slice(1)
            .join("-")
            .trim()
        );
      }

      return text;
    }


    function findFinalResult(data) {

      let finalResult = "";

      walk(
        data,
        (obj) => {

          if (finalResult) {
            return;
          }

          const possibleResult =
            firstValue(
              obj,
              [
                "result",
                "resultText",
                "matchResult"
              ]
            );

          if (
            possibleResult &&
            /won by|won the match|tied|drawn|abandoned|no result/i.test(
              String(possibleResult)
            )
          ) {
            finalResult =
              String(possibleResult);
          }
        }
      );

      return finalResult;
    }


    function findCurrentInnings(
      scoreData
    ) {

      let currentInnings = null;

      walk(
        scoreData,
        (obj) => {

          if (
            currentInnings !== null
          ) {
            return;
          }

          const value =
            obj?.currentInnings;

          if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number)
            ) {
              currentInnings = number;
            }
          }
        }
      );

      return currentInnings;
    }


    function oversToBalls(
      oversValue
    ) {

      if (
        oversValue === undefined ||
        oversValue === null
      ) {
        return 0;
      }

      const text =
        String(oversValue).trim();

      const parts =
        text.split(".");

      const completedOvers =
        Number(parts[0] || 0);

      const ballsInOver =
        Number(parts[1] || 0);

      return (
        completedOvers * 6
      ) + ballsInOver;
    }


    function ballsToOvers(
      balls
    ) {

      const safeBalls =
        Math.max(
          0,
          Math.floor(balls)
        );

      const overs =
        Math.floor(
          safeBalls / 6
        );

      const ballsRemaining =
        safeBalls % 6;

      return `${overs}.${ballsRemaining}`;
    }


    function findOversLimit(
      scoreData
    ) {

      let oversLimit = null;

      walk(
        scoreData,
        (obj) => {

          if (
            oversLimit !== null
          ) {
            return;
          }

          const values = [
            obj?.matchOvers,
            obj?.totalOvers,
            obj?.maxOvers,
            obj?.oversLimit,
            obj?.noOfOvers
          ];

          for (
            const value
            of values
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number) &&
              number > 0
            ) {
              oversLimit = number;
              return;
            }
          }

          const text =
            String(
              obj?.matchResult ||
              ""
            );

          const match =
            text.match(
              /\/\s*(\d+(?:\.\d+)?)\s*ov/i
            );

          if (match?.[1]) {

            const number =
              Number(match[1]);

            if (
              Number.isFinite(number)
            ) {
              oversLimit = number;
            }
          }
        }
      );

      return oversLimit;
    }


    function getFirstInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      if (!innings1) {
        return "";
      }

      const runs =
        Number(innings1.runs);

      const balls =
        oversToBalls(
          innings1.overs
        );

      if (
        !Number.isFinite(runs) ||
        balls <= 0
      ) {
        return "";
      }

      const exactRunRate =
        (
          runs * 6
        ) /
        balls;

      const displayedRunRate =
        Number(
          exactRunRate.toFixed(1)
        );

      if (
        !Number.isFinite(
          displayedRunRate
        )
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {
        return `CRR: ${displayedRunRate.toFixed(1)}`;
      }

      const projectedScore =
        Math.round(
          displayedRunRate *
          oversLimit
        );

      return (
        `PROJECTED SCORE : ${projectedScore} RUNS (CRR:${displayedRunRate.toFixed(1)})`
      );
    }


    function getSecondInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        !innings1 ||
        !innings2
      ) {
        return "";
      }

      const firstInningsRuns =
        Number(
          innings1.runs
        );

      const secondInningsRuns =
        Number(
          innings2.runs
        );

      if (
        !Number.isFinite(
          firstInningsRuns
        ) ||
        !Number.isFinite(
          secondInningsRuns
        )
      ) {
        return "";
      }

      const target =
        firstInningsRuns + 1;

      const runsNeeded =
        Math.max(
          0,
          target -
          secondInningsRuns
        );

      if (
        runsNeeded <= 0
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {
        return `${runsNeeded} runs needed`;
      }

      const ballsUsed =
        oversToBalls(
          innings2.overs
        );

      const totalBalls =
        oversLimit * 6;

      const ballsRemaining =
        Math.max(
          0,
          totalBalls -
          ballsUsed
        );

      let wicketsLost = 0;

      const rcb =
        String(
          innings2.rcb ||
          ""
        );

      const wicketMatch =
        rcb.match(
          /\/\s*(\d+)/
        );

      if (
        wicketMatch?.[1]
      ) {
        wicketsLost =
          Number(
            wicketMatch[1]
          );
      }

      const wicketsRemaining =
        Math.max(
          0,
          10 -
          wicketsLost
        );

      const oversRemaining =
        ballsToOvers(
          ballsRemaining
        );

      const requiredRunRate =
        ballsRemaining > 0
          ? (
              runsNeeded * 6
            ) /
            ballsRemaining
          : null;

      const rrrText =
        Number.isFinite(
          requiredRunRate
        )
          ? requiredRunRate.toFixed(2)
          : "--";

      return (
        `${runsNeeded} runs needed in ${oversRemaining} overs (${ballsRemaining} balls) with ${wicketsRemaining} wickets remaining. RRR: ${rrrText}`
      );
    }


    function getBottomText(
      scoreData,
      ballsData
    ) {

      const finalResult =
        findFinalResult(
          scoreData
        );

      if (finalResult) {
        return finalResult;
      }

      const oversLimit =
        findOversLimit(
          scoreData
        );

      const currentInnings =
        findCurrentInnings(
          scoreData
        );

      if (
        currentInnings === 1
      ) {
        return (
          getFirstInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      if (
        currentInnings === 2
      ) {
        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        innings2 &&
        Number(
          innings2.runs
        ) > 0
      ) {
        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      return (
        getFirstInningsText(
          ballsData,
          oversLimit
        )
      );
    }


    async function loadConfig() {

      const response =
        await fetch(
          `${CONFIG_URL}?t=${Date.now()}`,
          {
            cache:
              "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          `Config HTTP ${response.status}`
        );
      }

      const config =
        await response.json();

      const details =
        extractMatchDetails(
          config[
            "CricClubs Match URL"
          ] ||
          ""
        );

      if (details) {

        CLUB_ID =
          details.clubId;

        MATCH_ID =
          details.matchId;

        HAS_VALID_MATCH =
          true;
      }

      CURRENT_BACKGROUND =
        config[
          "Background"
        ] ||
        CURRENT_BACKGROUND;

      CUSTOM_BACKGROUND_URL =
        config[
          "Custom Background URL"
        ] ||
        CUSTOM_BACKGROUND_URL;

      applyBackground(
        CURRENT_BACKGROUND,
        CUSTOM_BACKGROUND_URL
      );
    }




    /* =========================================
       FOUR / SIX ANIMATION DETECTION
       ========================================= */

    const SEEN_DELIVERY_KEYS = new Set();
    let BOUNDARY_BASELINE_READY = false;
    let BOUNDARY_ANIMATION_ACTIVE = false;
    let BOUNDARY_HIDE_TIMER = null;

    function deliveryKey(ball) {
      const createdAt = firstValue(ball, ["createdAt", "lastModifiedAt", "timestamp", "time"]);
      const over = firstValue(ball, ["over", "overNum", "overNumber"]);
      const delivery = firstValue(ball, ["ball", "ballNum", "ballNumber"]);
      const batsman = firstValue(ball, ["batsmanName", "strikerName", "batsman"]);
      const runs = firstValue(ball, ["runs", "runsScored", "runsDisplay"]);
      const commentary = firstValue(ball, ["commentary", "description"]);
      return [createdAt, over, delivery, batsman, runs, commentary].join("|");
    }

    function collectDeliveries(ballsData) {
      const deliveries = [];

      walk(ballsData, (obj) => {
        if (!obj || typeof obj !== "object" || Array.isArray(obj)) return;

        const hasBallShape =
          obj.createdAt !== undefined &&
          (
            obj.ball !== undefined ||
            obj.ballType !== undefined ||
            obj.batsmanName !== undefined ||
            obj.strikerName !== undefined ||
            obj.commentary !== undefined
          ) &&
          (
            obj.runs !== undefined ||
            obj.runsScored !== undefined ||
            obj.runsDisplay !== undefined
          );

        if (!hasBallShape) return;

        const rawRuns = firstValue(obj, ["runs", "runsScored", "runsDisplay"]);
        const runs = Number(String(rawRuns).replace(/[^0-9.-]/g, ""));
        if (!Number.isFinite(runs)) return;

        deliveries.push({
          key: deliveryKey(obj),
          runs,
          createdAt: String(obj.createdAt || ""),
          raw: obj
        });
      });

      deliveries.sort((a, b) => {
        const ta = Date.parse(a.createdAt);
        const tb = Date.parse(b.createdAt);
        if (Number.isFinite(ta) && Number.isFinite(tb) && ta !== tb) return ta - tb;
        return a.key.localeCompare(b.key);
      });

      return deliveries;
    }

    function showBoundaryAnimation(runs) {
      if (runs !== 4 && runs !== 6) return;

      const overlay = document.getElementById("boundaryOverlay");
      const word = document.getElementById("boundaryWord");
      if (!overlay || !word) return;

      if (BOUNDARY_HIDE_TIMER) {
        clearTimeout(BOUNDARY_HIDE_TIMER);
        BOUNDARY_HIDE_TIMER = null;
      }

      BOUNDARY_ANIMATION_ACTIVE = true;
      overlay.className = "boundary-overlay";
      void overlay.offsetWidth;

      word.textContent = runs === 4 ? "FOUR" : "SIX";
      overlay.classList.add("show", runs === 4 ? "four" : "six");

      BOUNDARY_HIDE_TIMER = setTimeout(() => {
        overlay.className = "boundary-overlay";
        word.textContent = "";
        BOUNDARY_ANIMATION_ACTIVE = false;
      }, 2500);
    }

    function processBoundaryAnimations(ballsData) {
      const deliveries = collectDeliveries(ballsData);
      if (!deliveries.length) return;

      if (!BOUNDARY_BASELINE_READY) {
        for (const delivery of deliveries) {
          SEEN_DELIVERY_KEYS.add(delivery.key);
        }
        BOUNDARY_BASELINE_READY = true;
        return;
      }

      const unseen = deliveries.filter(d => !SEEN_DELIVERY_KEYS.has(d.key));

      for (const delivery of deliveries) {
        SEEN_DELIVERY_KEYS.add(delivery.key);
      }

      while (SEEN_DELIVERY_KEYS.size > 300) {
        const oldest = SEEN_DELIVERY_KEYS.values().next().value;
        SEEN_DELIVERY_KEYS.delete(oldest);
      }

      if (!unseen.length) return;

      const latestBoundary = [...unseen].reverse().find(d => d.runs === 4 || d.runs === 6);
      if (latestBoundary) {
        showBoundaryAnimation(latestBoundary.runs);
      }
    }


    async function loadScore() {

      if (
        !HAS_VALID_MATCH ||
        !CLUB_ID ||
        !MATCH_ID
      ) {
        return;
      }

      try {

        const [
          scoreResponse,
          ballsResponse
        ] =
          await Promise.all(
            [
              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              ),

              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}/balls?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              )
            ]
          );

        if (!scoreResponse.ok) {

          throw new Error(
            `Score HTTP ${scoreResponse.status}`
          );
        }

        if (!ballsResponse.ok) {

          throw new Error(
            `Balls HTTP ${ballsResponse.status}`
          );
        }

        const scoreData =
          await scoreResponse.json();

        const ballsData =
          await ballsResponse.json();


        processBoundaryAnimations(
          ballsData
        );

        const teams =
          buildTeams(
            scoreData
          );

        if (
          teams.length < 2
        ) {
          return;
        }

        const team1 =
          teams[0];

        const team2 =
          teams[1];

        document.getElementById(
          "mainTitle"
        ).textContent =
          "2026 Trinity Games";

        document.getElementById(
          "competitionTitle"
        ).textContent =
          findCompetitionTitle(
            scoreData
          );

        document.getElementById(
          "team1Name"
        ).textContent =
          team1.teamName ||
          "TEAM 1";

        document.getElementById(
          "team2Name"
        ).textContent =
          team2.teamName ||
          "TEAM 2";

        document.getElementById(
          "team1Score"
        ).textContent =
          formatScore(
            team1
          );

        document.getElementById(
          "team2Score"
        ).textContent =
          formatScore(
            team2
          );

        document.getElementById(
          "team1Overs"
        ).textContent =
          formatOvers(
            team1
          );

        document.getElementById(
          "team2Overs"
        ).textContent =
          formatOvers(
            team2
          );

        document.getElementById(
          "status"
        ).textContent =
          getBottomText(
            scoreData,
            ballsData
          );

      }

      catch (error) {

        console.error(
          "Score error:",
          error
        );
      }
    }


    async function updateScoreboard() {

      try {

        await loadConfig();

      }

      catch (error) {

        console.error(
          "Config error:",
          error
        );
      }

      await loadScore();
    }


    updateScoreboard();


    setInterval(
      updateScoreboard,
      UPDATE_INTERVAL_MS
    );

  </script>
