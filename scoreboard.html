<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=557,height=418,initial-scale=1.0"
  >

  <title>Trinity Cricket Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 557px;
      height: 418px;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #scoreboard {
      position: relative;
      width: 557px;
      height: 418px;
      overflow: hidden;
      color: #fff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;

      text-shadow:
        0 3px 7px rgba(0,0,0,1);
    }

    .header {
      height: 118px;
      flex: 0 0 118px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;

      padding:
        0 13px 10px;

      text-align: center;
    }

    .main-title {
      width: 100%;
      font-size: 27px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .competition-title {
      width: 100%;
      margin-top: 10px;

      font-size: 23px;
      line-height: 1;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Small Trinityhouse logo in the open space */
    .trinity-logo-holder {
      position: absolute;

      z-index: 20;

      top: 104px;
      left: 50%;

      width: 46px;
      height: 48px;

      transform:
        translateX(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: none;
    }

    .trinity-logo {
      display: block;
      width: auto;
      height: 46px;
      max-width: 46px;

      object-fit: contain;

      filter:
        drop-shadow(
          0 2px 4px rgba(0,0,0,0.75)
        );
    }

    .match {
      height: 204px;
      flex: 0 0 204px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        49px
        minmax(0, 1fr);

      align-items: end;

      padding:
        8px 14px 0;
    }

    .team {
      min-width: 0;
      height: 168px;

      display: grid;

      grid-template-rows:
        52px
        70px
        39px;

      align-items: center;
      justify-items: center;

      text-align: center;
    }

    .team-name {
      width: 100%;
      height: 52px;

      display: flex;

      align-items: flex-end;
      justify-content: center;

      padding:
        0 5px 5px;

      font-size: 21px;
      line-height: 1.05;
      font-weight: 900;

      text-align: center;

      white-space: normal;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .score {
      width: 100%;
      height: 70px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 61px;
      line-height: 1;
      font-weight: 900;

      letter-spacing: -2.6px;

      white-space: nowrap;
      text-align: center;
    }

    .overs {
      height: 39px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;
      font-weight: 900;

      white-space: nowrap;
    }

    .vs-column {
      height: 168px;

      display: grid;

      grid-template-rows:
        52px
        70px
        39px;
    }

    .vs {
      grid-row: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;
      font-weight: 900;
    }

    .result {
      flex: 1;

      display: flex;

      align-items: flex-start;
      justify-content: center;

      padding:
        5px 18px 0;

      text-align: center;

      font-size: 22px;
      line-height: 1.1;
      font-weight: 900;
    }
  </style>
</head>

  <script>

    const CONFIG_URL = "/api";
    const UPDATE_INTERVAL_MS = 5000;

    let CLUB_ID = null;
    let MATCH_ID = null;
    let HAS_VALID_MATCH = false;

    let CURRENT_BACKGROUND = "Stadium Night";
    let CUSTOM_BACKGROUND_URL = "";


    function firstValue(obj, keys) {

      for (const key of keys) {

        const value = obj?.[key];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {
          return value;
        }

      }

      return "";
    }


    function walk(obj, callback) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {
        return;
      }

      callback(obj);

      if (Array.isArray(obj)) {

        for (const item of obj) {
          walk(item, callback);
        }

      } else {

        for (const value of Object.values(obj)) {
          walk(value, callback);
        }

      }
    }


    function extractMatchDetails(matchUrl) {

      if (!matchUrl) {
        return null;
      }

      const text =
        String(matchUrl).trim();

      const clubMatch =
        text.match(
          /[?&]clubId=(\d+)/i
        );

      const matchMatch =
        text.match(
          /[?&]matchId=(\d+)/i
        );

      if (
        !clubMatch ||
        !matchMatch
      ) {
        return null;
      }

      return {
        clubId: clubMatch[1],
        matchId: matchMatch[1]
      };
    }


    function convertImageUrl(url) {

      if (!url) {
        return "";
      }

      const value =
        String(url).trim();

      const fileMatch =
        value.match(
          /\/file\/d\/([^/]+)/
        );

      if (fileMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w1600`
        );
      }

      const queryMatch =
        value.match(
          /[?&]id=([^&]+)/
        );

      if (queryMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${queryMatch[1]}&sz=w1600`
        );
      }

      return value;
    }


    function applyBackground(
      name,
      customUrl
    ) {

      const board =
        document.getElementById(
          "scoreboard"
        );

      if (
        name === "Custom" &&
        customUrl
      ) {

        const imageUrl =
          convertImageUrl(
            customUrl
          );

        board.style.backgroundImage =
          `
          linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.48)
          ),
          url("${imageUrl}")
          `;

        board.style.backgroundSize =
          "cover";

        board.style.backgroundPosition =
          "center";

        board.style.backgroundRepeat =
          "no-repeat";
      }
    }


    function findTeamHolder(data) {

      let holder = null;

      walk(
        data,
        (obj) => {

          if (holder) {
            return;
          }

          if (
            (
              obj?.team1Name ||
              obj?.teamOneName
            ) &&
            (
              obj?.team2Name ||
              obj?.teamTwoName
            )
          ) {

            holder = obj;
          }

        }
      );

      return holder;
    }


    function buildTeams(data) {

      const holder =
        findTeamHolder(data);

      if (!holder) {
        return [];
      }

      return [

        {
          teamName:
            holder.team1Name ??
            holder.teamOneName ??
            "",

          score:
            holder.team1Score ??
            holder.teamOneScore ??
            "",

          wickets:
            holder.team1Wickets ??
            holder.teamOneWickets ??
            "",

          overs:
            holder.team1Overs ??
            holder.teamOneOvers ??
            ""
        },

        {
          teamName:
            holder.team2Name ??
            holder.teamTwoName ??
            "",

          score:
            holder.team2Score ??
            holder.teamTwoScore ??
            "",

          wickets:
            holder.team2Wickets ??
            holder.teamTwoWickets ??
            "",

          overs:
            holder.team2Overs ??
            holder.teamTwoOvers ??
            ""
        }

      ];
    }


    function formatScore(team) {

      if (
        team.score === undefined ||
        team.score === null ||
        String(team.score).trim() === ""
      ) {
        return "--";
      }

      if (
        team.wickets !== undefined &&
        team.wickets !== null &&
        String(team.wickets).trim() !== ""
      ) {

        return (
          `${team.score}/${team.wickets}`
        );
      }

      return String(team.score);
    }


    function formatOvers(team) {

      if (
        team.overs !== undefined &&
        team.overs !== null &&
        String(team.overs).trim() !== ""
      ) {

        return (
          `${team.overs} overs`
        );
      }

      return "-- overs";
    }


    function findCompetitionTitle(data) {

      let title = "";

      walk(
        data,
        (obj) => {

          if (title) {
            return;
          }

          title =
            firstValue(
              obj,
              [
                "matchName",
                "fixtureName",
                "seriesName",
                "leagueName",
                "tournamentName"
              ]
            );

        }
      );

      if (!title) {
        return "LIVE CRICKET";
      }

      const text =
        String(title).trim();

      const parts =
        text.split("-");

      if (parts.length >= 2) {

        return (
          parts
            .slice(1)
            .join("-")
            .trim()
        );
      }

      return text;
    }


    function findFinalResult(data) {

      let finalResult = "";

      walk(
        data,
        (obj) => {

          if (finalResult) {
            return;
          }

          const possibleResult =
            firstValue(
              obj,
              [
                "result",
                "resultText",
                "matchResult"
              ]
            );

          if (
            possibleResult &&
            /won by|won the match|tied|drawn|abandoned|no result/i.test(
              String(possibleResult)
            )
          ) {

            finalResult =
              String(possibleResult);
          }

        }
      );

      return finalResult;
    }


    function findCurrentInnings(
      scoreData
    ) {

      let currentInnings = null;

      walk(
        scoreData,
        (obj) => {

          if (
            currentInnings !== null
          ) {
            return;
          }

          const value =
            obj?.currentInnings;

          if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number)
            ) {
              currentInnings = number;
            }
          }

        }
      );

      return currentInnings;
    }


    function oversToBalls(
      oversValue
    ) {

      if (
        oversValue === undefined ||
        oversValue === null
      ) {
        return 0;
      }

      const text =
        String(
          oversValue
        ).trim();

      const parts =
        text.split(".");

      const completedOvers =
        Number(parts[0] || 0);

      const ballsInOver =
        Number(parts[1] || 0);

      return (
        completedOvers * 6
      ) + ballsInOver;
    }


    function ballsToOvers(
      balls
    ) {

      const safeBalls =
        Math.max(
          0,
          Math.floor(balls)
        );

      const overs =
        Math.floor(
          safeBalls / 6
        );

      const ballsRemaining =
        safeBalls % 6;

      return (
        `${overs}.${ballsRemaining}`
      );
    }


    function findOversLimit(
      scoreData
    ) {

      let oversLimit = null;

      walk(
        scoreData,
        (obj) => {

          if (
            oversLimit !== null
          ) {
            return;
          }

          const values = [
            obj?.matchOvers,
            obj?.totalOvers,
            obj?.maxOvers,
            obj?.oversLimit,
            obj?.noOfOvers
          ];

          for (
            const value
            of values
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number) &&
              number > 0
            ) {

              oversLimit = number;
              return;
            }
          }

          const text =
            String(
              obj?.matchResult ||
              ""
            );

          const match =
            text.match(
              /\/\s*(\d+(?:\.\d+)?)\s*ov/i
            );

          if (match?.[1]) {

            const number =
              Number(match[1]);

            if (
              Number.isFinite(number)
            ) {
              oversLimit = number;
            }
          }

        }
      );

      return oversLimit;
    }


    function getFirstInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      if (!innings1) {
        return "";
      }

      const runs =
        Number(innings1.runs);

      const balls =
        oversToBalls(
          innings1.overs
        );

      if (
        !Number.isFinite(runs) ||
        balls <= 0
      ) {
        return "";
      }

      const exactRunRate =
        (
          runs * 6
        ) /
        balls;

      const displayedRunRate =
        Number(
          exactRunRate.toFixed(1)
        );

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {

        return (
          `CRR: ${displayedRunRate.toFixed(1)}`
        );
      }

      const projectedScore =
        Math.round(
          displayedRunRate *
          oversLimit
        );

      return (
        `PROJECTED SCORE : ${projectedScore} RUNS (CRR:${displayedRunRate.toFixed(1)})`
      );
    }


    function getSecondInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        !innings1 ||
        !innings2
      ) {
        return "";
      }

      const firstInningsRuns =
        Number(
          innings1.runs
        );

      const secondInningsRuns =
        Number(
          innings2.runs
        );

      if (
        !Number.isFinite(firstInningsRuns) ||
        !Number.isFinite(secondInningsRuns)
      ) {
        return "";
      }

      const target =
        firstInningsRuns + 1;

      const runsNeeded =
        Math.max(
          0,
          target -
          secondInningsRuns
        );

      if (
        runsNeeded <= 0
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {

        return (
          `${runsNeeded} runs needed`
        );
      }

      const ballsUsed =
        oversToBalls(
          innings2.overs
        );

      const totalBalls =
        oversLimit * 6;

      const ballsRemaining =
        Math.max(
          0,
          totalBalls -
          ballsUsed
        );

      let wicketsLost = 0;

      const rcb =
        String(
          innings2.rcb ||
          ""
        );

      const wicketMatch =
        rcb.match(
          /\/\s*(\d+)/
        );

      if (wicketMatch?.[1]) {
        wicketsLost =
          Number(
            wicketMatch[1]
          );
      }

      const wicketsRemaining =
        Math.max(
          0,
          10 -
          wicketsLost
        );

      const oversRemaining =
        ballsToOvers(
          ballsRemaining
        );

      const requiredRunRate =
        ballsRemaining > 0
          ? (
              runsNeeded * 6
            ) /
            ballsRemaining
          : null;

      const rrrText =
        Number.isFinite(
          requiredRunRate
        )
          ? requiredRunRate.toFixed(2)
          : "--";

      return (
        `${runsNeeded} runs needed in ${oversRemaining} overs (${ballsRemaining} balls) with ${wicketsRemaining} wickets remaining. RRR: ${rrrText}`
      );
    }


    function getBottomText(
      scoreData,
      ballsData
    ) {

      const finalResult =
        findFinalResult(
          scoreData
        );

      if (finalResult) {
        return finalResult;
      }

      const oversLimit =
        findOversLimit(
          scoreData
        );

      const currentInnings =
        findCurrentInnings(
          scoreData
        );

      if (
        currentInnings === 1
      ) {

        return (
          getFirstInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      if (
        currentInnings === 2
      ) {

        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        innings2 &&
        Number(
          innings2.runs
        ) > 0
      ) {

        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      return (
        getFirstInningsText(
          ballsData,
          oversLimit
        )
      );
    }


    async function loadConfig() {

      const response =
        await fetch(
          `${CONFIG_URL}?t=${Date.now()}`,
          {
            cache:
              "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          `Config HTTP ${response.status}`
        );
      }

      const config =
        await response.json();

      const details =
        extractMatchDetails(
          config[
            "CricClubs Match URL"
          ] || ""
        );

      if (details) {

        CLUB_ID =
          details.clubId;

        MATCH_ID =
          details.matchId;

        HAS_VALID_MATCH =
          true;
      }

      CURRENT_BACKGROUND =
        config[
          "Background"
        ] ||
        CURRENT_BACKGROUND;

      CUSTOM_BACKGROUND_URL =
        config[
          "Custom Background URL"
        ] ||
        CUSTOM_BACKGROUND_URL;

      applyBackground(
        CURRENT_BACKGROUND,
        CUSTOM_BACKGROUND_URL
      );
    }


    async function loadScore() {

      if (
        !HAS_VALID_MATCH ||
        !CLUB_ID ||
        !MATCH_ID
      ) {
        return;
      }

      try {

        const [
          scoreResponse,
          ballsResponse
        ] =
          await Promise.all(
            [
              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              ),

              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}/balls?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              )
            ]
          );

        if (!scoreResponse.ok) {

          throw new Error(
            `Score HTTP ${scoreResponse.status}`
          );
        }

        if (!ballsResponse.ok) {

          throw new Error(
            `Balls HTTP ${ballsResponse.status}`
          );
        }

        const scoreData =
          await scoreResponse.json();

        const ballsData =
          await ballsResponse.json();

        const teams =
          buildTeams(
            scoreData
          );

        if (
          teams.length < 2
        ) {
          return;
        }

        const team1 =
          teams[0];

        const team2 =
          teams[1];

        document.getElementById(
          "mainTitle"
        ).textContent =
          "2026 Trinity Games";

        document.getElementById(
          "competitionTitle"
        ).textContent =
          findCompetitionTitle(
            scoreData
          );

        document.getElementById(
          "team1Name"
        ).textContent =
          team1.teamName ||
          "TEAM 1";

        document.getElementById(
          "team2Name"
        ).textContent =
          team2.teamName ||
          "TEAM 2";

        document.getElementById(
          "team1Score"
        ).textContent =
          formatScore(
            team1
          );

        document.getElementById(
          "team2Score"
        ).textContent =
          formatScore(
            team2
          );

        document.getElementById(
          "team1Overs"
        ).textContent =
          formatOvers(
            team1
          );

        document.getElementById(
          "team2Overs"
        ).textContent =
          formatOvers(
            team2
          );

        document.getElementById(
          "status"
        ).textContent =
          getBottomText(
            scoreData,
            ballsData
          );

      } catch (error) {

        console.error(
          "Score error:",
          error
        );
      }
    }


    async function updateScoreboard() {

      try {

        await loadConfig();

      } catch (error) {

        console.error(
          "Config error:",
          error
        );
      }

      await loadScore();
    }


    updateScoreboard();

    setInterval(
      updateScoreboard,
      UPDATE_INTERVAL_MS
    );

  </script>

</body>
</html>
