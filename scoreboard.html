<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=557,height=418,initial-scale=1.0"
  >

  <title>Trinity Cricket Scoreboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 557px;
      height: 418px;

      overflow: hidden;

      background: #000;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    #scoreboard {
      position: relative;

      width: 557px;
      height: 418px;

      overflow: hidden;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .stadium {
      position: absolute;
      inset: 0;

      overflow: hidden;

      pointer-events: none;
    }

    .stadium::before {
      content: "";

      position: absolute;

      left: -43px;
      right: -43px;

      top: 138px;
      height: 121px;

      background:
        linear-gradient(
          to bottom,
          rgba(5,7,9,0.20),
          rgba(0,0,0,0.72)
        );

      clip-path:
        polygon(
          0 20%,
          16% 31%,
          30% 22%,
          50% 37%,
          70% 22%,
          84% 31%,
          100% 20%,
          100% 100%,
          0 100%
        );
    }

    .field {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 171px;

      background:
        linear-gradient(
          to bottom,
          rgba(39,93,39,0.48),
          rgba(14,54,21,0.92)
        );

      pointer-events: none;
    }

    .field::after {
      content: "";

      position: absolute;

      left: 215px;
      bottom: -14px;

      width: 128px;
      height: 160px;

      background:
        linear-gradient(
          to bottom,
          rgba(181,161,94,0.12),
          rgba(152,132,67,0.28)
        );

      clip-path:
        polygon(
          40% 0,
          60% 0,
          100% 100%,
          0 100%
        );
    }

    .content {
      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      text-shadow:
        0 3px 7px rgba(0,0,0,1);
    }


    /* =====================================
       HEADER
       ===================================== */

    .header {
      height: 146px;
      flex: 0 0 146px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: flex-end;

      padding:
        0 13px 5px;

      text-align: center;
    }

    .main-title {
      width: 100%;

      font-size: 27px;
      line-height: 1;

      font-weight: 900;

      white-space: nowrap;
    }

    .competition-title {
      width: 100%;

      margin-top: 9px;

      font-size: 23px;
      line-height: 1;

      font-weight: 900;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logo-holder {
      height: 55px;

      margin-top: 8px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .trinity-logo {
      display: block;

      width: auto;
      height: 50px;

      object-fit: contain;

      opacity: 0.95;

      filter:
        drop-shadow(
          0 2px 4px rgba(0,0,0,0.65)
        );
    }


    /* =====================================
       MATCH
       ===================================== */

    .match {
      height: 176px;
      flex: 0 0 176px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        49px
        minmax(0, 1fr);

      align-items: end;

      padding:
        2px 14px 0;
    }

    .team {
      min-width: 0;

      height: 168px;

      display: grid;

      grid-template-rows:
        52px
        70px
        39px;

      align-items: center;

      justify-items: center;

      text-align: center;
    }

    .team-name {
      width: 100%;
      height: 52px;

      display: flex;

      align-items: flex-end;
      justify-content: center;

      padding:
        0 5px 5px;

      font-size: 21px;
      line-height: 1.05;

      font-weight: 900;

      text-align: center;

      white-space: normal;

      overflow: hidden;

      overflow-wrap: anywhere;

      word-break: normal;
    }

    .score {
      width: 100%;
      height: 70px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 61px;
      line-height: 1;

      font-weight: 900;

      letter-spacing: -2.6px;

      white-space: nowrap;

      text-align: center;
    }

    .overs {
      height: 39px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;

      font-weight: 900;

      white-space: nowrap;
    }

    .vs-column {
      height: 168px;

      display: grid;

      grid-template-rows:
        52px
        70px
        39px;
    }

    .vs {
      grid-row: 2;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 24px;
      line-height: 1;

      font-weight: 900;
    }


    /* =====================================
       BOTTOM LIVE INFO / RESULT
       ===================================== */

    .result {
      flex: 1;

      display: flex;

      align-items: flex-start;
      justify-content: center;

      padding:
        5px 18px 0;

      text-align: center;

      font-size: 22px;
      line-height: 1.1;

      font-weight: 900;
    }

  </style>

</head>


<body>

  <div id="scoreboard">

    <div
      class="stadium"
      id="stadiumOverlay"
    ></div>

    <div
      class="field"
      id="fieldOverlay"
    ></div>

    <div class="content">

      <div class="header">

        <div
          class="main-title"
          id="mainTitle"
        >
          2026 Trinity Games
        </div>

        <div
          class="competition-title"
          id="competitionTitle"
        >
          LIVE CRICKET
        </div>

        <div class="logo-holder">

          <img
            src="trinityhouse-logo.png"
            class="trinity-logo"
            alt="Trinityhouse"
          >

        </div>

      </div>


      <div class="match">

        <div class="team">

          <div
            class="team-name"
            id="team1Name"
          >
            Loading...
          </div>

          <div
            class="score"
            id="team1Score"
          >
            --
          </div>

          <div
            class="overs"
            id="team1Overs"
          >
            -- overs
          </div>

        </div>


        <div class="vs-column">

          <div class="vs">
            VS
          </div>

        </div>


        <div class="team">

          <div
            class="team-name"
            id="team2Name"
          >
            Loading...
          </div>

          <div
            class="score"
            id="team2Score"
          >
            --
          </div>

          <div
            class="overs"
            id="team2Overs"
          >
            -- overs
          </div>

        </div>

      </div>


      <div
        class="result"
        id="status"
      ></div>

    </div>

  </div>


  <script>

    const CONFIG_URL =
      "/api";

    const UPDATE_INTERVAL_MS =
      5000;


    let CLUB_ID =
      null;

    let MATCH_ID =
      null;

    let HAS_VALID_MATCH =
      false;

    let CURRENT_BACKGROUND =
      "Stadium Night";

    let CUSTOM_BACKGROUND_URL =
      "";


    /* =========================================
       HELPERS
       ========================================= */

    function firstValue(
      obj,
      keys
    ) {

      for (
        const key
        of keys
      ) {

        const value =
          obj?.[key];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {

          return value;

        }

      }

      return "";

    }


    function walk(
      obj,
      callback
    ) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {

        return;

      }

      callback(obj);

      if (
        Array.isArray(obj)
      ) {

        for (
          const item
          of obj
        ) {

          walk(
            item,
            callback
          );

        }

      }

      else {

        for (
          const value
          of Object.values(obj)
        ) {

          walk(
            value,
            callback
          );

        }

      }

    }


    /* =========================================
       MATCH URL
       ========================================= */

    function extractMatchDetails(
      matchUrl
    ) {

      if (
        !matchUrl
      ) {

        return null;

      }

      const text =
        String(
          matchUrl
        ).trim();

      const clubMatch =
        text.match(
          /[?&]clubId=(\d+)/i
        );

      const matchMatch =
        text.match(
          /[?&]matchId=(\d+)/i
        );

      if (
        !clubMatch ||
        !matchMatch
      ) {

        return null;

      }

      return {

        clubId:
          clubMatch[1],

        matchId:
          matchMatch[1]

      };

    }


    /* =========================================
       BACKGROUND
       ========================================= */

    function convertImageUrl(
      url
    ) {

      if (
        !url
      ) {

        return "";

      }

      const value =
        String(
          url
        ).trim();

      const fileMatch =
        value.match(
          /\/file\/d\/([^/]+)/
        );

      if (
        fileMatch?.[1]
      ) {

        return (
          `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w1600`
        );

      }

      const queryMatch =
        value.match(
          /[?&]id=([^&]+)/
        );

      if (
        queryMatch?.[1]
      ) {

        return (
          `https://drive.google.com/thumbnail?id=${queryMatch[1]}&sz=w1600`
        );

      }

      return value;

    }


    function applyBackground(
      name,
      customUrl
    ) {

      const board =
        document.getElementById(
          "scoreboard"
        );

      const stadium =
        document.getElementById(
          "stadiumOverlay"
        );

      const field =
        document.getElementById(
          "fieldOverlay"
        );


      if (
        name === "Custom" &&
        customUrl
      ) {

        const imageUrl =
          convertImageUrl(
            customUrl
          );

        board.style.backgroundImage =
          `
          linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.48)
          ),
          url("${imageUrl}")
          `;

        board.style.backgroundSize =
          "cover";

        board.style.backgroundPosition =
          "center";

        board.style.backgroundRepeat =
          "no-repeat";

        stadium.style.display =
          "none";

        field.style.display =
          "none";

        return;

      }

      stadium.style.display =
        "block";

      field.style.display =
        "block";

    }


    /* =========================================
       SCORE SUMMARY DATA
       ========================================= */

    function findTeamHolder(
      data
    ) {

      let holder =
        null;

      walk(
        data,
        (obj) => {

          if (
            holder
          ) {

            return;

          }

          const hasTeam1 =
            obj?.team1Name ||
            obj?.teamOneName;

          const hasTeam2 =
            obj?.team2Name ||
            obj?.teamTwoName;

          if (
            hasTeam1 &&
            hasTeam2
          ) {

            holder =
              obj;

          }

        }
      );

      return holder;

    }


    function buildTeams(
      data
    ) {

      const holder =
        findTeamHolder(
          data
        );

      if (
        !holder
      ) {

        return [];

      }

      return [

        {

          teamName:
            holder.team1Name ??
            holder.teamOneName ??
            "",

          score:
            holder.team1Score ??
            holder.teamOneScore ??
            "",

          wickets:
            holder.team1Wickets ??
            holder.teamOneWickets ??
            "",

          overs:
            holder.team1Overs ??
            holder.teamOneOvers ??
            ""

        },

        {

          teamName:
            holder.team2Name ??
            holder.teamTwoName ??
            "",

          score:
            holder.team2Score ??
            holder.teamTwoScore ??
            "",

          wickets:
            holder.team2Wickets ??
            holder.teamTwoWickets ??
            "",

          overs:
            holder.team2Overs ??
            holder.teamTwoOvers ??
            ""

        }

      ];

    }


    function formatScore(
      team
    ) {

      if (
        team.score === undefined ||
        team.score === null ||
        String(team.score).trim() === ""
      ) {

        return "--";

      }

      if (
        team.wickets !== undefined &&
        team.wickets !== null &&
        String(team.wickets).trim() !== ""
      ) {

        return (
          `${team.score}/${team.wickets}`
        );

      }

      return String(
        team.score
      );

    }


    function formatOvers(
      team
    ) {

      if (
        team.overs !== undefined &&
        team.overs !== null &&
        String(team.overs).trim() !== ""
      ) {

        return (
          `${team.overs} overs`
        );

      }

      return "-- overs";

    }


    function findRawMatchTitle(
      data
    ) {

      let title =
        "";

      walk(
        data,
        (obj) => {

          if (
            title
          ) {

            return;

          }

          title =
            firstValue(
              obj,
              [
                "matchName",
                "fixtureName",
                "seriesName",
                "leagueName",
                "tournamentName"
              ]
            );

        }
      );

      return title;

    }


    function findCompetitionTitle(
      data
    ) {

      const rawTitle =
        findRawMatchTitle(
          data
        );

      if (
        !rawTitle
      ) {

        return "LIVE CRICKET";

      }

      const text =
        String(
          rawTitle
        ).trim();

      const parts =
        text.split(
          "-"
        );

      if (
        parts.length >= 2
      ) {

        return (
          parts
            .slice(1)
            .join("-")
            .trim()
        );

      }

      return text;

    }


    /* =========================================
       FINAL RESULT
       ========================================= */

    function findFinalResult(
      data
    ) {

      let finalResult =
        "";

      walk(
        data,
        (obj) => {

          if (
            finalResult
          ) {

            return;

          }

          const possibleResult =
            firstValue(
              obj,
              [
                "result",
                "resultText",
                "matchResult"
              ]
            );

          if (
            possibleResult &&
            /won by|won the match|tied|drawn|abandoned|no result/i.test(
              String(
                possibleResult
              )
            )
          ) {

            finalResult =
              String(
                possibleResult
              );

          }

        }
      );

      return finalResult;

    }


    /* =========================================
       OVERS / BALL HELPERS
       ========================================= */

    function oversToBalls(
      oversValue
    ) {

      if (
        oversValue === undefined ||
        oversValue === null
      ) {

        return 0;

      }

      const text =
        String(
          oversValue
        ).trim();

      const parts =
        text.split(
          "."
        );

      const completedOvers =
        Number(
          parts[0] || 0
        );

      const ballsInOver =
        Number(
          parts[1] || 0
        );

      return (
        completedOvers * 6
      ) + ballsInOver;

    }


    function ballsToOvers(
      balls
    ) {

      const safeBalls =
        Math.max(
          0,
          Math.floor(
            balls
          )
        );

      const overs =
        Math.floor(
          safeBalls / 6
        );

      const ballsRemaining =
        safeBalls % 6;

      return (
        `${overs}.${ballsRemaining}`
      );

    }


    /* =========================================
       MATCH OVERS LIMIT
       ========================================= */

    function findOversLimit(
      scoreData,
      ballsData
    ) {

      let oversLimit =
        null;


      walk(
        scoreData,
        (obj) => {

          if (
            oversLimit !== null
          ) {

            return;

          }

          const possibleValues = [

            obj?.matchOvers,
            obj?.totalOvers,
            obj?.maxOvers,
            obj?.oversLimit,
            obj?.noOfOvers

          ];

          for (
            const value
            of possibleValues
          ) {

            if (
              value !== undefined &&
              value !== null &&
              String(value).trim() !== ""
            ) {

              const number =
                Number(
                  value
                );

              if (
                Number.isFinite(
                  number
                ) &&
                number > 0
              ) {

                oversLimit =
                  number;

                return;

              }

            }

          }

          const text =
            String(
              obj?.matchResult ||
              ""
            );

          const match =
            text.match(
              /\/\s*(\d+(?:\.\d+)?)\s*ov/i
            );

          if (
            match?.[1]
          ) {

            const number =
              Number(
                match[1]
              );

            if (
              Number.isFinite(
                number
              )
            ) {

              oversLimit =
                number;

            }

          }

        }
      );


      /*
        If not found in score summary,
        estimate from the innings when possible.
      */

      if (
        oversLimit === null
      ) {

        const innings1 =
          ballsData?.data?.innings1Balls;

        const innings2 =
          ballsData?.data?.innings2Balls;


        /*
          Only use common cricket limits
          if the endpoint itself doesn't expose one.
        */

        const candidates =
          [
            innings1?.overs,
            innings2?.overs
          ];

        for (
          const candidate
          of candidates
        ) {

          const balls =
            oversToBalls(
              candidate
            );

          if (
            balls > 120
          ) {

            oversLimit =
              50;

            break;

          }

        }

      }


      return oversLimit;

    }


    /* =========================================
       FIRST INNINGS PROJECTION
       ========================================= */

    function getFirstInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;


      if (
        !innings1 ||
        innings1.runs === undefined ||
        innings1.runs === null
      ) {

        return "";

      }


      const runs =
        Number(
          innings1.runs
        );


      const balls =
        oversToBalls(
          innings1.overs
        );


      if (
        !Number.isFinite(
          runs
        ) ||
        balls <= 0
      ) {

        return "";

      }


      /*
        Prefer the latest over's CricClubs
        runRate if available.
      */

      let runRate =
        null;


      const oversMap =
        innings1?.oversMap;


      if (
        oversMap &&
        typeof oversMap === "object"
      ) {

        const overKeys =
          Object.keys(
            oversMap
          );


        if (
          overKeys.length > 0
        ) {

          overKeys.sort(
            (a, b) => {

              const aNum =
                Number(
                  a.replace(
                    /\D/g,
                    ""
                  )
                );

              const bNum =
                Number(
                  b.replace(
                    /\D/g,
                    ""
                  )
                );

              return (
                aNum -
                bNum
              );

            }
          );


          const latestOver =
            oversMap[
              overKeys[
                overKeys.length - 1
              ]
            ];


          const value =
            Number(
              latestOver?.runRate
            );


          if (
            Number.isFinite(
              value
            )
          ) {

            runRate =
              value;

          }

        }

      }


      /*
        Fallback: calculate CRR ourselves.
      */

      if (
        runRate === null
      ) {

        runRate =
          (
            runs * 6
          ) /
          balls;

      }


      if (
        !Number.isFinite(
          runRate
        )
      ) {

        return "";

      }


      /*
        We need the match overs limit for
        a useful projected score.
      */

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {

        return (
          `CRR: ${runRate.toFixed(1)}`
        );

      }


      const projectedScore =
        Math.round(
          runRate *
          oversLimit
        );


      return (
        `PROJECTED SCORE : ${projectedScore} RUNS (CRR:${runRate.toFixed(1)})`
      );

    }


    /* =========================================
       SECOND INNINGS CHASE
       ========================================= */

    function getSecondInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;


      const innings2 =
        ballsData?.data?.innings2Balls;


      if (
        !innings1 ||
        !innings2
      ) {

        return "";

      }


      const firstInningsRuns =
        Number(
          innings1.runs
        );


      const secondInningsRuns =
        Number(
          innings2.runs
        );


      if (
        !Number.isFinite(
          firstInningsRuns
        ) ||
        !Number.isFinite(
          secondInningsRuns
        )
      ) {

        return "";

      }


      const target =
        firstInningsRuns + 1;


      const runsNeeded =
        Math.max(
          0,
          target -
          secondInningsRuns
        );


      /*
        If target already reached, don't show
        chase info — final result should appear
        from the score summary.
      */

      if (
        runsNeeded <= 0
      ) {

        return "";

      }


      const ballsUsed =
        oversToBalls(
          innings2.overs
        );


      let ballsRemaining =
        null;


      if (
        Number.isFinite(
          oversLimit
        ) &&
        oversLimit > 0
      ) {

        ballsRemaining =
          Math.max(
            0,
            (
              oversLimit * 6
            ) -
            ballsUsed
          );

      }


      /*
        Wickets lost from rcb e.g. "2/0"
      */

      let wicketsLost =
        0;


      const rcb =
        String(
          innings2.rcb ||
          ""
        );


      const wicketMatch =
        rcb.match(
          /\/\s*(\d+)/
        );


      if (
        wicketMatch?.[1]
      ) {

        wicketsLost =
          Number(
            wicketMatch[1]
          );

      }


      const wicketsRemaining =
        Math.max(
          0,
          10 -
          wicketsLost
        );


      let requiredRunRate =
        null;


      if (
        ballsRemaining !== null &&
        ballsRemaining > 0
      ) {

        requiredRunRate =
          (
            runsNeeded * 6
          ) /
          ballsRemaining;

      }


      if (
        ballsRemaining === null
      ) {

        return (
          `${runsNeeded} runs needed with ${wicketsRemaining} wickets remaining`
        );

      }


      const oversRemaining =
        ballsToOvers(
          ballsRemaining
        );


      const rrrText =
        Number.isFinite(
          requiredRunRate
        )
          ? requiredRunRate.toFixed(2)
          : "--";


      return (
        `${runsNeeded} runs needed in ${oversRemaining} overs (${ballsRemaining} balls) with ${wicketsRemaining} wickets remaining. RRR: ${rrrText}`
      );

    }


    /* =========================================
       BOTTOM LINE PRIORITY
       ========================================= */

    function getBottomText(
      scoreData,
      ballsData
    ) {

      /*
        1. Finished match
      */

      const finalResult =
        findFinalResult(
          scoreData
        );


      if (
        finalResult
      ) {

        return finalResult;

      }


      const oversLimit =
        findOversLimit(
          scoreData,
          ballsData
        );


      const innings2 =
        ballsData?.data?.innings2Balls;


      /*
        2. Second innings
      */

      if (
        innings2 &&
        Number(
          innings2.runs
        ) >= 0
      ) {

        const chaseText =
          getSecondInningsText(
            ballsData,
            oversLimit
          );


        if (
          chaseText
        ) {

          return chaseText;

        }

      }


      /*
        3. First innings
      */

      return (
        getFirstInningsText(
          ballsData,
          oversLimit
        )
      );

    }


    /* =========================================
       CONFIG
       ========================================= */

    async function loadConfig() {

      const response =
        await fetch(

          `${CONFIG_URL}?t=${Date.now()}`,

          {
            cache:
              "no-store"
          }

        );


      if (
        !response.ok
      ) {

        throw new Error(
          `Config HTTP ${response.status}`
        );

      }


      const config =
        await response.json();


      const details =
        extractMatchDetails(
          config[
            "CricClubs Match URL"
          ] || ""
        );


      if (
        details
      ) {

        CLUB_ID =
          details.clubId;

        MATCH_ID =
          details.matchId;

        HAS_VALID_MATCH =
          true;

      }


      CURRENT_BACKGROUND =
        config[
          "Background"
        ] ||
        CURRENT_BACKGROUND;


      CUSTOM_BACKGROUND_URL =
        config[
          "Custom Background URL"
        ] ||
        CUSTOM_BACKGROUND_URL;


      applyBackground(
        CURRENT_BACKGROUND,
        CUSTOM_BACKGROUND_URL
      );

    }


    /* =========================================
       LOAD LIVE SCORE
       ========================================= */

    async function loadScore() {

      if (
        !HAS_VALID_MATCH ||
        !CLUB_ID ||
        !MATCH_ID
      ) {

        return;

      }


      try {

        /*
          Fetch score summary and ball-by-ball
          at the same time.
        */

        const [
          scoreResponse,
          ballsResponse
        ] =
          await Promise.all(

            [

              fetch(

                `/api/${CLUB_ID}/${MATCH_ID}?t=${Date.now()}`,

                {
                  cache:
                    "no-store"
                }

              ),

              fetch(

                `/api/${CLUB_ID}/${MATCH_ID}/balls?t=${Date.now()}`,

                {
                  cache:
                    "no-store"
                }

              )

            ]

          );


        if (
          !scoreResponse.ok
        ) {

          throw new Error(
            `Score HTTP ${scoreResponse.status}`
          );

        }


        if (
          !ballsResponse.ok
        ) {

          throw new Error(
            `Balls HTTP ${ballsResponse.status}`
          );

        }


        const scoreData =
          await scoreResponse.json();


        const ballsData =
          await ballsResponse.json();


        const teams =
          buildTeams(
            scoreData
          );


        if (
          teams.length < 2
        ) {

          throw new Error(
            "Could not identify both teams"
          );

        }


        const team1 =
          teams[0];


        const team2 =
          teams[1];


        document.getElementById(
          "mainTitle"
        ).textContent =
          "2026 Trinity Games";


        document.getElementById(
          "competitionTitle"
        ).textContent =
          findCompetitionTitle(
            scoreData
          );


        document.getElementById(
          "team1Name"
        ).textContent =
          team1.teamName ||
          "TEAM 1";


        document.getElementById(
          "team2Name"
        ).textContent =
          team2.teamName ||
          "TEAM 2";


        document.getElementById(
          "team1Score"
        ).textContent =
          formatScore(
            team1
          );


        document.getElementById(
          "team2Score"
        ).textContent =
          formatScore(
            team2
          );


        document.getElementById(
          "team1Overs"
        ).textContent =
          formatOvers(
            team1
          );


        document.getElementById(
          "team2Overs"
        ).textContent =
          formatOvers(
            team2
          );


        document.getElementById(
          "status"
        ).textContent =
          getBottomText(
            scoreData,
            ballsData
          );

      }


      catch (
        error
      ) {

        console.error(
          "Score error:",
          error
        );

      }

    }


    /* =========================================
       UPDATE
       ========================================= */

    async function updateScoreboard() {

      try {

        await loadConfig();

      }

      catch (
        error
      ) {

        console.error(
          "Google Sheet config error:",
          error
        );

      }


      await loadScore();

    }


    updateScoreboard();


    setInterval(
      updateScoreboard,
      UPDATE_INTERVAL_MS
    );

  </script>
