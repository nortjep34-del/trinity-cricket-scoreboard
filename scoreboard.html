<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Trinity Cricket Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 384px;
      height: 288px;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #scoreboard {
      position: relative;
      width: 384px;
      height: 288px;
      overflow: hidden;
      color: #fff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );
    }

    .stadium {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .stadium::before {
      content: "";
      position: absolute;
      left: -30px;
      right: -30px;
      top: 95px;
      height: 83px;

      background:
        linear-gradient(
          to bottom,
          rgba(5,7,9,0.2),
          rgba(0,0,0,0.72)
        );

      clip-path:
        polygon(
          0 20%,
          16% 31%,
          30% 22%,
          50% 37%,
          70% 22%,
          84% 31%,
          100% 20%,
          100% 100%,
          0 100%
        );
    }

    .field {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 118px;

      background:
        linear-gradient(
          to bottom,
          rgba(39,93,39,0.48),
          rgba(14,54,21,0.92)
        );

      pointer-events: none;
    }

    .field::after {
      content: "";
      position: absolute;
      left: 148px;
      bottom: -9px;
      width: 88px;
      height: 110px;

      background:
        linear-gradient(
          to bottom,
          rgba(181,161,94,0.12),
          rgba(152,132,67,0.28)
        );

      clip-path:
        polygon(
          40% 0,
          60% 0,
          100% 100%,
          0 100%
        );
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;

      text-shadow:
        0 2px 4px rgba(0,0,0,0.95);
    }

    .header {
      height: 70px;
      flex: 0 0 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 8px 5px;
      text-align: center;
    }

    .match-title {
      width: 100%;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1;
      font-weight: 800;
    }

    .match {
      height: 142px;
      flex: 0 0 142px;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        38px
        minmax(0, 1fr);

      align-items: center;
      padding: 0 8px;
    }

    .team {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .team-name {
      width: 100%;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      line-height: 1;
      font-weight: 900;
      white-space: normal;
      text-align: center;
    }

    .score {
      width: 100%;
      margin-top: 5px;
      font-size: 48px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -2.7px;
      white-space: nowrap;
      text-align: center;
    }

    .overs {
      margin-top: 9px;
      font-size: 13px;
      line-height: 1;
      font-weight: 800;
    }

    .vs {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 30px;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }

    .result {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 15px 15px;
      text-align: center;
      font-size: 20px;
      line-height: 1.06;
      font-weight: 900;
    }
  </style>
</head>

<body>

  <div id="scoreboard">

    <div class="stadium"></div>
    <div class="field"></div>

    <div class="content">

      <div class="header">

        <div
          class="match-title"
          id="matchTitle"
        >
          2026 Trinity Games - CommonWealth
        </div>

        <div class="meta">
          League
          &nbsp;&nbsp;|&nbsp;&nbsp;
          <span id="matchDate">01/08/2026</span>
        </div>

      </div>

      <div class="match">

        <div class="team">

          <div
            class="team-name"
            id="team1Name"
          >
            BPMS
          </div>

          <div
            class="score"
            id="team1Score"
          >
            123/10
          </div>

          <div
            class="overs"
            id="team1Overs"
          >
            20 overs
          </div>

        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">

          <div
            class="team-name"
            id="team2Name"
          >
            Commonwealth A
          </div>

          <div
            class="score"
            id="team2Score"
          >
            124/3
          </div>

          <div
            class="overs"
            id="team2Overs"
          >
            11.1 overs
          </div>

        </div>

      </div>

      <div
        class="result"
        id="status"
      >
        CWA won by 7 Wickets
      </div>

    </div>

  </div>
<script>
  const params = new URLSearchParams(window.location.search);

  const CLUB_ID = params.get("club") || "38195";
  const MATCH_ID = params.get("id") || "1561";

  const REFRESH_MS = 5000;

  function firstValue(obj, keys) {
    for (const key of keys) {
      const value = obj?.[key];

      if (
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
      ) {
        return value;
      }
    }

    return "";
  }

  function walk(obj, callback) {
    if (!obj || typeof obj !== "object") {
      return;
    }

    callback(obj);

    if (Array.isArray(obj)) {
      for (const item of obj) {
        walk(item, callback);
      }
    } else {
      for (const value of Object.values(obj)) {
        walk(value, callback);
      }
    }
  }

  function findTeamHolder(data) {
    let holder = null;

    walk(data, (obj) => {
      if (holder) {
        return;
      }

      const hasTeam1 =
        obj?.team1Name ||
        obj?.teamOneName;

      const hasTeam2 =
        obj?.team2Name ||
        obj?.teamTwoName;

      if (hasTeam1 && hasTeam2) {
        holder = obj;
      }
    });

    return holder;
  }

  function buildTeams(data) {
    const holder = findTeamHolder(data);

    if (!holder) {
      return [];
    }

    return [
      {
        teamName:
          holder.team1Name ??
          holder.teamOneName ??
          "",

        score:
          holder.team1Score ??
          holder.teamOneScore ??
          "",

        wickets:
          holder.team1Wickets ??
          holder.teamOneWickets ??
          "",

        overs:
          holder.team1Overs ??
          holder.teamOneOvers ??
          ""
      },

      {
        teamName:
          holder.team2Name ??
          holder.teamTwoName ??
          "",

        score:
          holder.team2Score ??
          holder.teamTwoScore ??
          "",

        wickets:
          holder.team2Wickets ??
          holder.teamTwoWickets ??
          "",

        overs:
          holder.team2Overs ??
          holder.teamTwoOvers ??
          ""
      }
    ];
  }

  function formatScore(team) {
    if (
      team.score === undefined ||
      team.score === null ||
      String(team.score).trim() === ""
    ) {
      return "--";
    }

    if (
      team.wickets !== undefined &&
      team.wickets !== null &&
      String(team.wickets).trim() !== ""
    ) {
      return `${team.score}/${team.wickets}`;
    }

    return String(team.score);
  }

  function formatOvers(team) {
    if (
      team.overs !== undefined &&
      team.overs !== null &&
      String(team.overs).trim() !== ""
    ) {
      return `${team.overs} overs`;
    }

    return "-- overs";
  }

  function findMatchTitle(data) {
    let title = "";

    walk(data, (obj) => {
      if (title) {
        return;
      }

      title = firstValue(obj, [
        "matchName",
        "fixtureName",
        "seriesName",
        "leagueName",
        "tournamentName"
      ]);
    });

    return title || "LIVE CRICKET";
  }

  function findMatchDate(data) {
    let date = "";

    walk(data, (obj) => {
      if (date) {
        return;
      }

      date = firstValue(obj, [
        "matchDate",
        "fixtureDate",
        "date"
      ]);
    });

    return formatDate(date);
  }

  function formatDate(value) {
    if (!value) {
      return "LIVE";
    }

    const text = String(value).trim();

    const slash = text.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );

    if (slash) {
      return `${slash[1].padStart(2, "0")}/${slash[2].padStart(2, "0")}/${slash[3]}`;
    }

    const iso = text.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );

    if (iso) {
      return `${iso[3]}/${iso[2]}/${iso[1]}`;
    }

    return text;
  }

  function findStatus(data) {
    let result = "";

    walk(data, (obj) => {
      if (result) {
        return;
      }

      result = firstValue(obj, [
        "result",
        "resultText",
        "matchResult",
        "status",
        "matchStatus",
        "chaseText"
      ]);
    });

    return result || "MATCH IN PROGRESS";
  }

  async function loadScore() {
    try {
      const response = await fetch(
        `/api/${CLUB_ID}/${MATCH_ID}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();

      const teams = buildTeams(data);

      if (teams.length < 2) {
        throw new Error("Could not identify both teams");
      }

      const team1 = teams[0];
      const team2 = teams[1];

      document.getElementById("matchTitle").textContent =
        findMatchTitle(data);

      document.getElementById("matchDate").textContent =
        findMatchDate(data);

      document.getElementById("team1Name").textContent =
        team1.teamName || "TEAM 1";

      document.getElementById("team2Name").textContent =
        team2.teamName || "TEAM 2";

      document.getElementById("team1Score").textContent =
        formatScore(team1);

      document.getElementById("team2Score").textContent =
        formatScore(team2);

      document.getElementById("team1Overs").textContent =
        formatOvers(team1);

      document.getElementById("team2Overs").textContent =
        formatOvers(team2);

      document.getElementById("status").textContent =
        findStatus(data);

    } catch (error) {
      console.error(error);

      document.getElementById("status").textContent =
        `DATA ERROR: ${error.message}`;
    }
  }

  loadScore();
  setInterval(loadScore, REFRESH_MS);
</script>
</body>
</html>
