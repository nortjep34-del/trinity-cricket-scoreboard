<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=557,height=418,initial-scale=1.0">
  <title>Trinity Cricket Scoreboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 557px;
      height: 418px;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #scoreboard {
      position: relative;
      width: 557px;
      height: 418px;
      overflow: hidden;
      color: #fff;

      background:
        radial-gradient(
          circle at 7% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        radial-gradient(
          circle at 93% 13%,
          rgba(255,255,255,0.25) 0,
          rgba(255,255,255,0.08) 5%,
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #070b0f 0%,
          #111719 33%,
          #14271b 62%,
          #0b2412 100%
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      text-shadow: 0 3px 7px rgba(0,0,0,1);
    }

    /* ---------------- HEADER ---------------- */

    .header {
      height: 106px;
      flex: 0 0 106px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 18px 13px 2px;
      text-align: center;
    }

    .main-title {
      width: 100%;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .competition-title {
      width: 100%;
      margin-top: 11px;

      font-size: 24px;
      line-height: 1;
      font-weight: 900;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------------- MATCH ---------------- */

    .match {
      height: 219px;
      flex: 0 0 219px;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        49px
        minmax(0, 1fr);

      align-items: center;
      padding: 8px 14px 0;
    }

    .team {
      min-width: 0;
      height: 176px;

      display: grid;
      grid-template-rows:
        58px
        76px
        42px;

      align-items: center;
      justify-items: center;
      text-align: center;
    }

    .team-name {
      width: 100%;
      height: 58px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 0 5px 6px;

      font-size: 22px;
      line-height: 1.05;
      font-weight: 900;

      text-align: center;
      white-space: normal;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .score {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 64px;
      line-height: 1;
      font-weight: 900;

      letter-spacing: -2.6px;
      white-space: nowrap;
      text-align: center;
    }

    .overs {
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .vs-column {
      height: 176px;

      display: grid;
      grid-template-rows:
        58px
        76px
        42px;
    }

    .vs {
      grid-row: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      line-height: 1;
      font-weight: 900;
    }

    /* ---------------- LIVE INFO / RESULT ---------------- */

    .result {
      flex: 1;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding: 7px 16px 0;

      text-align: center;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 900;
    }



    /* ---------------- FOUR / SIX / WICKET CELEBRATIONS ---------------- */

    .boundary-overlay {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;

      /* Approved deep navy -> true maroon -> gold blend */
      background:
        radial-gradient(circle at 18% 20%, rgba(255,216,116,.14), transparent 26%),
        radial-gradient(circle at 78% 23%, rgba(74,15,33,.42), transparent 33%),
        radial-gradient(circle at 50% 76%, rgba(10,39,72,.82), transparent 50%),
        linear-gradient(
          135deg,
          #06162b 0%,
          #0a2748 34%,
          #4a0f21 68%,
          #9b7220 100%
        );
    }

    .boundary-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          155deg,
          rgba(255,255,255,.03),
          transparent 20%,
          rgba(227,173,47,.06) 52%,
          transparent 78%
        );
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .boundary-overlay.show {
      display: flex;
      animation: celebrationOverlay 3.5s ease both;
    }

    .boundary-flash {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: #fff3cf;
      opacity: 0;
      mix-blend-mode: screen;
    }

    .boundary-overlay.show .boundary-flash {
      animation: celebrationFlash 3.5s ease both;
    }

    .boundary-word {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 20;
      transform: translate(-50%, -50%) scale(.1);
      font-family: Arial Black, Arial, Helvetica, sans-serif;
      font-weight: 1000;
      line-height: .86;
      letter-spacing: -.055em;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      backface-visibility: hidden;
    }

    /* FOUR — ivory/white, maroon edge, gold impact rays */
    .boundary-overlay.four .boundary-word {
      font-size: 122px;
      color: #fffdf4;
      -webkit-text-stroke: 3px #4a0f21;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 #e3ad2f,
        0 6px 0 #2b0914,
        0 14px 24px rgba(0,0,0,.78),
        0 0 8px rgba(255,255,255,.28);

      animation:
        fourFinalPop
        3.5s
        cubic-bezier(.16,.9,.24,1)
        both;
    }

    /* SIX — deliberately much bigger, metallic gold, full fireworks */
    .boundary-overlay.six .boundary-word {
      font-size: 172px;
      color: #ffd874;
      -webkit-text-stroke: 4px #4a0f21;
      paint-order: stroke fill;
      text-shadow:
        0 3px 0 #e3ad2f,
        0 9px 0 #2b0914,
        0 18px 34px rgba(0,0,0,.82),
        0 0 18px rgba(227,173,47,.70);

      animation:
        sixFinalPop
        3.5s
        cubic-bezier(.14,.94,.18,1)
        both;
    }

    /* WICKET — crisp white text over tall stumps and flying bails */
    .boundary-overlay.wicket .boundary-word {
      font-size: 102px;
      color: #fffdf4;
      -webkit-text-stroke: 4px #4a0f21;
      paint-order: stroke fill;
      text-shadow:
        0 3px 0 #e3ad2f,
        0 8px 0 #2b0914,
        0 18px 32px rgba(0,0,0,.82);

      animation:
        wicketFinalPop
        3.5s
        cubic-bezier(.14,.92,.2,1)
        both;
    }

    /* ---------- FOUR IMPACT RAYS ---------- */

    .impact-rays {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 2px;
      z-index: 8;
      display: none;
      pointer-events: none;
    }

    .boundary-overlay.show.four .impact-rays {
      display: block;
    }

    .impact-ray {
      --a: 0deg;
      --len: 180px;
      --delay: 0s;

      position: absolute;
      left: 0;
      top: 0;
      width: var(--len);
      height: 3px;
      transform-origin: left center;
      transform: rotate(var(--a)) scaleX(.05);

      background:
        linear-gradient(
          90deg,
          rgba(255,221,124,.98),
          rgba(227,173,47,.72),
          rgba(227,173,47,0)
        );

      opacity: 0;
      filter:
        drop-shadow(
          0 0 5px rgba(227,173,47,.55)
        );

      animation-delay: var(--delay);
    }

    .impact-ray.maroon {
      background:
        linear-gradient(
          90deg,
          rgba(104,22,44,.95),
          rgba(74,15,33,.58),
          rgba(74,15,33,0)
        );
    }

    .boundary-overlay.show.four .impact-ray {
      animation:
        impactRayBurst
        3.5s
        ease-out
        both;
    }

    /* ---------- SIX FIREWORKS ---------- */

    .fireworks-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      pointer-events: none;
    }

    .boundary-overlay.show.six .fireworks-layer {
      display: block;
    }

    .firework-burst {
      position: absolute;
      width: 2px;
      height: 2px;
    }

    .fw-main  { left: 50%; top: 50%; }
    .fw-one   { left: 24%; top: 29%; }
    .fw-two   { left: 77%; top: 31%; }
    .fw-three { left: 33%; top: 72%; }
    .fw-four  { left: 68%; top: 69%; }

    .firework-spark {
      --a: 0deg;
      --d: 180px;
      --delay: 0s;

      position: absolute;
      left: 0;
      top: 0;

      width: 5px;
      height: 5px;
      border-radius: 50%;

      background: #ffd874;
      box-shadow:
        0 0 7px #ffd874,
        0 0 17px #e3ad2f;

      opacity: 0;
      animation-delay: var(--delay);
    }

    .firework-spark.white {
      background: #fff7dd;
      box-shadow:
        0 0 7px #ffffff,
        0 0 17px #e3ad2f;
    }

    .firework-spark.maroon {
      background: #68162c;
      box-shadow:
        0 0 7px #68162c,
        0 0 15px #4a0f21;
    }

    .firework-spark.small {
      width: 3px;
      height: 3px;
    }

    .firework-comet {
      --a: 0deg;
      --d: 160px;
      --delay: 0s;

      position: absolute;
      left: 0;
      top: 0;

      width: 66px;
      height: 2px;
      transform-origin: left center;

      background:
        linear-gradient(
          90deg,
          rgba(255,239,189,1),
          rgba(227,173,47,.70),
          rgba(227,173,47,0)
        );

      opacity: 0;
      animation-delay: var(--delay);
    }

    .boundary-overlay.show.six .firework-spark {
      animation:
        sixFireworkSpark
        3.5s
        cubic-bezier(.17,.8,.2,1)
        both;
    }

    .boundary-overlay.show.six .firework-comet {
      animation:
        sixFireworkComet
        3.5s
        ease-out
        both;
    }

    /* ---------- WICKET STUMPS / BAILS / DEBRIS ---------- */

    .wicket-stumps {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 170px;
      height: 300px;
      transform: translate(-50%, -50%) scale(.5);
      z-index: 11;
      opacity: 0;
      display: none;
      pointer-events: none;
    }

    .boundary-overlay.show.wicket .wicket-stumps {
      display: block;
      animation:
        wicketStumpsHit
        3.5s
        ease
        both;
    }

    .wicket-stump {
      position: absolute;
      bottom: 0;

      width: 20px;
      height: 248px;
      border-radius: 9px 9px 4px 4px;

      background:
        linear-gradient(
          90deg,
          #8a5c12,
          #ffe5a0 38%,
          #d9a737 70%,
          #684107
        );

      box-shadow:
        0 0 14px rgba(227,173,47,.38),
        0 10px 16px rgba(0,0,0,.42);
    }

    .wicket-stump.one   { left: 18px; }
    .wicket-stump.two   { left: 75px; }
    .wicket-stump.three { left: 132px; }

    .wicket-bail {
      position: absolute;
      top: 28px;

      width: 70px;
      height: 12px;
      border-radius: 8px;

      background:
        linear-gradient(
          #ffe9ad,
          #b87913
        );

      box-shadow:
        0 3px 9px rgba(0,0,0,.44);

      transform-origin: center;
    }

    .wicket-bail.one { left: 12px; }
    .wicket-bail.two { left: 79px; }

    .boundary-overlay.show.wicket .wicket-bail.one {
      animation:
        wicketBailOne
        3.5s
        ease-out
        both;
    }

    .boundary-overlay.show.wicket .wicket-bail.two {
      animation:
        wicketBailTwo
        3.5s
        ease-out
        both;
    }

    .wicket-debris {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: none;
      pointer-events: none;
    }

    .boundary-overlay.show.wicket .wicket-debris {
      display: block;
    }

    .wicket-chip {
      --x: 0px;
      --y: 0px;
      --r: 0deg;
      --delay: 0s;

      position: absolute;
      left: 50%;
      top: 51%;

      width: 7px;
      height: 16px;
      border-radius: 3px;

      background: #e3ad2f;
      opacity: 0;
      animation-delay: var(--delay);
    }

    .wicket-chip.maroon {
      background: #65162d;
    }

    .wicket-chip.white {
      background: #fff3cf;
    }

    .boundary-overlay.show.wicket .wicket-chip {
      animation:
        wicketChipFly
        3.5s
        cubic-bezier(.18,.75,.2,1)
        both;
    }

    /* ---------- KEYFRAMES ---------- */

    @keyframes celebrationOverlay {
      0%   { opacity: 0; }
      3%   { opacity: 1; }
      91%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes celebrationFlash {
      0%,3% { opacity: 0; }
      5%    { opacity: .88; }
      7%    { opacity: 0; }
      13%   { opacity: .22; }
      15%,100% { opacity: 0; }
    }

    @keyframes fourFinalPop {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.1);
      }

      6% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.32);
      }

      12% {
        transform:
          translate(-50%, -50%)
          scale(.90);
      }

      19% {
        transform:
          translate(-50%, -50%)
          scale(1.10);
      }

      28%,74% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1);
      }

      82% {
        transform:
          translate(-50%, -50%)
          scale(1.06);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.90);
      }
    }

    @keyframes sixFinalPop {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.05);
      }

      4% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.58);
      }

      9% {
        transform:
          translate(-50%, -50%)
          scale(.82);
      }

      15% {
        transform:
          translate(-50%, -50%)
          scale(1.24);
      }

      22% {
        transform:
          translate(-50%, -50%)
          scale(.96);
      }

      30% {
        transform:
          translate(-50%, -50%)
          scale(1.10);
      }

      36%,72% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.06);
      }

      80% {
        transform:
          translate(-50%, -50%)
          scale(1.15);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.90);
      }
    }

    @keyframes wicketFinalPop {
      0%,6% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.1);
      }

      9% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.34);
      }

      14% {
        transform:
          translate(-50%, -50%)
          scale(.92);
      }

      20% {
        transform:
          translate(-50%, -50%)
          scale(1.10);
      }

      28%,74% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1);
      }

      82% {
        transform:
          translate(-50%, -50%)
          scale(1.05);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.90);
      }
    }

    @keyframes impactRayBurst {
      0%,4% {
        opacity: 0;
        transform:
          rotate(var(--a))
          scaleX(.05);
      }

      7% {
        opacity: 1;
      }

      22% {
        opacity: .90;
        transform:
          rotate(var(--a))
          scaleX(1);
      }

      52% {
        opacity: .50;
        transform:
          rotate(var(--a))
          scaleX(1.25);
      }

      100% {
        opacity: 0;
        transform:
          rotate(var(--a))
          scaleX(1.55);
      }
    }

    @keyframes sixFireworkSpark {
      0%,6% {
        opacity: 0;
        transform:
          rotate(var(--a))
          translateX(0)
          scale(.2);
      }

      9% {
        opacity: 1;
      }

      32% {
        opacity: 1;
        transform:
          rotate(var(--a))
          translateX(var(--d))
          scale(1);
      }

      62% {
        opacity: .85;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * 1.26))
          translateY(8px)
          scale(.72);
      }

      100% {
        opacity: 0;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * 1.55))
          translateY(28px)
          scale(.1);
      }
    }

    @keyframes sixFireworkComet {
      0%,5% {
        opacity: 0;
        transform:
          rotate(var(--a))
          translateX(0)
          scaleX(.2);
      }

      8% {
        opacity: 1;
      }

      28% {
        opacity: .95;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * .56))
          scaleX(1);
      }

      62% {
        opacity: .42;
        transform:
          rotate(var(--a))
          translateX(var(--d))
          scaleX(.78);
      }

      100% {
        opacity: 0;
        transform:
          rotate(var(--a))
          translateX(calc(var(--d) * 1.30))
          scaleX(.2);
      }
    }

    @keyframes wicketStumpsHit {
      0% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.38);
      }

      5% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(1.16);
      }

      12%,64% {
        opacity: .88;
        transform:
          translate(-50%, -50%)
          scale(1);
      }

      82%,100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(1);
      }
    }

    @keyframes wicketBailOne {
      0%,7% {
        transform:
          translate(0,0)
          rotate(0);
      }

      20% {
        transform:
          translate(-82px,-112px)
          rotate(-132deg);
      }

      55% {
        transform:
          translate(-125px,-148px)
          rotate(-260deg);
      }

      100% {
        opacity: 0;
        transform:
          translate(-165px,115px)
          rotate(-450deg);
      }
    }

    @keyframes wicketBailTwo {
      0%,7% {
        transform:
          translate(0,0)
          rotate(0);
      }

      20% {
        transform:
          translate(88px,-118px)
          rotate(136deg);
      }

      55% {
        transform:
          translate(130px,-152px)
          rotate(270deg);
      }

      100% {
        opacity: 0;
        transform:
          translate(170px,118px)
          rotate(455deg);
      }
    }

    @keyframes wicketChipFly {
      0%,6% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(.2);
      }

      8% {
        opacity: 1;
      }

      30% {
        opacity: 1;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          rotate(var(--r))
          scale(1);
      }

      68% {
        opacity: .70;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y) + 22px)
          )
          rotate(calc(var(--r) + 85deg))
          scale(.75);
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y) + 90px)
          )
          rotate(calc(var(--r) + 175deg))
          scale(.2);
      }
    }
  </style>
</head>

<body>

  <div id="scoreboard">


    <!-- Full-screen FOUR / SIX / WICKET celebration overlay -->
    <div id="boundaryOverlay" class="boundary-overlay" aria-hidden="true">

      <div class="boundary-flash"></div>

      <!-- FOUR impact rays -->
      <div id="impactRays" class="impact-rays" aria-hidden="true"></div>

      <!-- SIX fireworks -->
      <div class="fireworks-layer" aria-hidden="true">
        <div id="fwMain" class="firework-burst fw-main"></div>
        <div id="fwOne" class="firework-burst fw-one"></div>
        <div id="fwTwo" class="firework-burst fw-two"></div>
        <div id="fwThree" class="firework-burst fw-three"></div>
        <div id="fwFour" class="firework-burst fw-four"></div>
      </div>

      <!-- WICKET tall stumps and flying bails -->
      <div id="wicketStumps" class="wicket-stumps" aria-hidden="true">
        <div class="wicket-stump one"></div>
        <div class="wicket-stump two"></div>
        <div class="wicket-stump three"></div>

        <div class="wicket-bail one"></div>
        <div class="wicket-bail two"></div>
      </div>

      <div id="wicketDebris" class="wicket-debris" aria-hidden="true"></div>

      <div id="boundaryWord" class="boundary-word"></div>

    </div>

    <div class="content">

      <div class="header">

        <div
          class="main-title"
          id="mainTitle"
        >
          2026 Trinity Games
        </div>

        <div
          class="competition-title"
          id="competitionTitle"
        >
          LIVE CRICKET
        </div>
</div>


      <div class="match">

        <div class="team">

          <div
            class="team-name"
            id="team1Name"
          >
            Loading...

            VS

            class="team-name"

  </div>


  <script>

    const CONFIG_URL = "/api";
    const UPDATE_INTERVAL_MS = 5000;

    let CLUB_ID = null;
    let MATCH_ID = null;
    let HAS_VALID_MATCH = false;

    let CURRENT_BACKGROUND = "Stadium Night";
    let CUSTOM_BACKGROUND_URL = "";


    function firstValue(obj, keys) {

      for (const key of keys) {

        const value = obj?.[key];

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {
          return value;
        }
      }

      return "";
    }


    function walk(obj, callback) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {
        return;
      }

      callback(obj);

      if (Array.isArray(obj)) {

        for (const item of obj) {
          walk(item, callback);
        }

      } else {

        for (const value of Object.values(obj)) {
          walk(value, callback);
        }
      }
    }


    function extractMatchDetails(matchUrl) {

      if (!matchUrl) {
        return null;
      }

      const text = String(matchUrl).trim();

      const clubMatch =
        text.match(/[?&]clubId=(\d+)/i);

      const matchMatch =
        text.match(/[?&]matchId=(\d+)/i);

      if (
        !clubMatch ||
        !matchMatch
      ) {
        return null;
      }

      return {
        clubId: clubMatch[1],
        matchId: matchMatch[1]
      };
    }


    function convertImageUrl(url) {

      if (!url) {
        return "";
      }

      const value =
        String(url).trim();

      const fileMatch =
        value.match(/\/file\/d\/([^/]+)/);

      if (fileMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w1600`
        );
      }

      const queryMatch =
        value.match(/[?&]id=([^&]+)/);

      if (queryMatch?.[1]) {

        return (
          `https://drive.google.com/thumbnail?id=${queryMatch[1]}&sz=w1600`
        );
      }

      return value;
    }


    function applyBackground(
      name,
      customUrl
    ) {

      const board =
        document.getElementById(
          "scoreboard"
        );

      if (
        name === "Custom" &&
        customUrl
      ) {

        const imageUrl =
          convertImageUrl(
            customUrl
          );

        board.style.backgroundImage =
          `
          linear-gradient(
            rgba(0,0,0,0.30),
            rgba(0,0,0,0.48)
          ),
          url("${imageUrl}")
          `;

        board.style.backgroundSize =
          "cover";

        board.style.backgroundPosition =
          "center";

        board.style.backgroundRepeat =
          "no-repeat";
      }
    }


    function findTeamHolder(data) {

      let holder = null;

      walk(
        data,
        (obj) => {

          if (holder) {
            return;
          }

          const hasTeam1 =
            obj?.team1Name ||
            obj?.teamOneName;

          const hasTeam2 =
            obj?.team2Name ||
            obj?.teamTwoName;

          if (
            hasTeam1 &&
            hasTeam2
          ) {
            holder = obj;
          }
        }
      );

      return holder;
    }


    function buildTeams(data) {

      const holder =
        findTeamHolder(data);

      if (!holder) {
        return [];
      }

      return [

        {
          teamName:
            holder.team1Name ??
            holder.teamOneName ??
            "",

          score:
            holder.team1Score ??
            holder.teamOneScore ??
            "",

          wickets:
            holder.team1Wickets ??
            holder.teamOneWickets ??
            "",

          overs:
            holder.team1Overs ??
            holder.teamOneOvers ??
            ""
        },

        {
          teamName:
            holder.team2Name ??
            holder.teamTwoName ??
            "",

          score:
            holder.team2Score ??
            holder.teamTwoScore ??
            "",

          wickets:
            holder.team2Wickets ??
            holder.teamTwoWickets ??
            "",

          overs:
            holder.team2Overs ??
            holder.teamTwoOvers ??
            ""
        }

      ];
    }


    function formatScore(team) {

      if (
        team.score === undefined ||
        team.score === null ||
        String(team.score).trim() === ""
      ) {
        return "--";
      }

      if (
        team.wickets !== undefined &&
        team.wickets !== null &&
        String(team.wickets).trim() !== ""
      ) {
        return `${team.score}/${team.wickets}`;
      }

      return String(team.score);
    }


    function formatOvers(team) {

      if (
        team.overs !== undefined &&
        team.overs !== null &&
        String(team.overs).trim() !== ""
      ) {
        return `${team.overs} overs`;
      }

      return "-- overs";
    }


    function findCompetitionTitle(data) {

      let title = "";

      walk(
        data,
        (obj) => {

          if (title) {
            return;
          }

          title =
            firstValue(
              obj,
              [
                "matchName",
                "fixtureName",
                "seriesName",
                "leagueName",
                "tournamentName"
              ]
            );
        }
      );

      if (!title) {
        return "LIVE CRICKET";
      }

      const text =
        String(title).trim();

      const parts =
        text.split("-");

      if (parts.length >= 2) {

        return (
          parts
            .slice(1)
            .join("-")
            .trim()
        );
      }

      return text;
    }


    function findFinalResult(data) {

      let finalResult = "";

      walk(
        data,
        (obj) => {

          if (finalResult) {
            return;
          }

          const possibleResult =
            firstValue(
              obj,
              [
                "result",
                "resultText",
                "matchResult"
              ]
            );

          if (
            possibleResult &&
            /won by|won the match|tied|drawn|abandoned|no result/i.test(
              String(possibleResult)
            )
          ) {
            finalResult =
              String(possibleResult);
          }
        }
      );

      return finalResult;
    }


    function findCurrentInnings(
      scoreData
    ) {

      let currentInnings = null;

      walk(
        scoreData,
        (obj) => {

          if (
            currentInnings !== null
          ) {
            return;
          }

          const value =
            obj?.currentInnings;

          if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number)
            ) {
              currentInnings = number;
            }
          }
        }
      );

      return currentInnings;
    }


    function oversToBalls(
      oversValue
    ) {

      if (
        oversValue === undefined ||
        oversValue === null
      ) {
        return 0;
      }

      const text =
        String(oversValue).trim();

      const parts =
        text.split(".");

      const completedOvers =
        Number(parts[0] || 0);

      const ballsInOver =
        Number(parts[1] || 0);

      return (
        completedOvers * 6
      ) + ballsInOver;
    }


    function ballsToOvers(
      balls
    ) {

      const safeBalls =
        Math.max(
          0,
          Math.floor(balls)
        );

      const overs =
        Math.floor(
          safeBalls / 6
        );

      const ballsRemaining =
        safeBalls % 6;

      return `${overs}.${ballsRemaining}`;
    }


    function findOversLimit(
      scoreData
    ) {

      let oversLimit = null;

      walk(
        scoreData,
        (obj) => {

          if (
            oversLimit !== null
          ) {
            return;
          }

          const values = [
            obj?.matchOvers,
            obj?.totalOvers,
            obj?.maxOvers,
            obj?.oversLimit,
            obj?.noOfOvers
          ];

          for (
            const value
            of values
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number) &&
              number > 0
            ) {
              oversLimit = number;
              return;
            }
          }

          const text =
            String(
              obj?.matchResult ||
              ""
            );

          const match =
            text.match(
              /\/\s*(\d+(?:\.\d+)?)\s*ov/i
            );

          if (match?.[1]) {

            const number =
              Number(match[1]);

            if (
              Number.isFinite(number)
            ) {
              oversLimit = number;
            }
          }
        }
      );

      return oversLimit;
    }


    function getFirstInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      if (!innings1) {
        return "";
      }

      const runs =
        Number(innings1.runs);

      const balls =
        oversToBalls(
          innings1.overs
        );

      if (
        !Number.isFinite(runs) ||
        balls <= 0
      ) {
        return "";
      }

      const exactRunRate =
        (
          runs * 6
        ) /
        balls;

      const displayedRunRate =
        Number(
          exactRunRate.toFixed(1)
        );

      if (
        !Number.isFinite(
          displayedRunRate
        )
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {
        return `CRR: ${displayedRunRate.toFixed(1)}`;
      }

      const projectedScore =
        Math.round(
          displayedRunRate *
          oversLimit
        );

      return (
        `PROJECTED SCORE : ${projectedScore} RUNS (CRR:${displayedRunRate.toFixed(1)})`
      );
    }


    function getSecondInningsText(
      ballsData,
      oversLimit
    ) {

      const innings1 =
        ballsData?.data?.innings1Balls;

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        !innings1 ||
        !innings2
      ) {
        return "";
      }

      const firstInningsRuns =
        Number(
          innings1.runs
        );

      const secondInningsRuns =
        Number(
          innings2.runs
        );

      if (
        !Number.isFinite(
          firstInningsRuns
        ) ||
        !Number.isFinite(
          secondInningsRuns
        )
      ) {
        return "";
      }

      const target =
        firstInningsRuns + 1;

      const runsNeeded =
        Math.max(
          0,
          target -
          secondInningsRuns
        );

      if (
        runsNeeded <= 0
      ) {
        return "";
      }

      if (
        !Number.isFinite(
          oversLimit
        ) ||
        oversLimit <= 0
      ) {
        return `${runsNeeded} runs needed`;
      }

      const ballsUsed =
        oversToBalls(
          innings2.overs
        );

      const totalBalls =
        oversLimit * 6;

      const ballsRemaining =
        Math.max(
          0,
          totalBalls -
          ballsUsed
        );

      let wicketsLost = 0;

      const rcb =
        String(
          innings2.rcb ||
          ""
        );

      const wicketMatch =
        rcb.match(
          /\/\s*(\d+)/
        );

      if (
        wicketMatch?.[1]
      ) {
        wicketsLost =
          Number(
            wicketMatch[1]
          );
      }

      const wicketsRemaining =
        Math.max(
          0,
          10 -
          wicketsLost
        );

      const oversRemaining =
        ballsToOvers(
          ballsRemaining
        );

      const requiredRunRate =
        ballsRemaining > 0
          ? (
              runsNeeded * 6
            ) /
            ballsRemaining
          : null;

      const rrrText =
        Number.isFinite(
          requiredRunRate
        )
          ? requiredRunRate.toFixed(2)
          : "--";

      return (
        `${runsNeeded} runs needed in ${oversRemaining} overs (${ballsRemaining} balls) with ${wicketsRemaining} wickets remaining. RRR: ${rrrText}`
      );
    }


    function getBottomText(
      scoreData,
      ballsData
    ) {

      const finalResult =
        findFinalResult(
          scoreData
        );

      if (finalResult) {
        return finalResult;
      }

      const oversLimit =
        findOversLimit(
          scoreData
        );

      const currentInnings =
        findCurrentInnings(
          scoreData
        );

      if (
        currentInnings === 1
      ) {
        return (
          getFirstInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      if (
        currentInnings === 2
      ) {
        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      const innings2 =
        ballsData?.data?.innings2Balls;

      if (
        innings2 &&
        Number(
          innings2.runs
        ) > 0
      ) {
        return (
          getSecondInningsText(
            ballsData,
            oversLimit
          )
        );
      }

      return (
        getFirstInningsText(
          ballsData,
          oversLimit
        )
      );
    }


    async function loadConfig() {

      const response =
        await fetch(
          `${CONFIG_URL}?t=${Date.now()}`,
          {
            cache:
              "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          `Config HTTP ${response.status}`
        );
      }

      const config =
        await response.json();

      const details =
        extractMatchDetails(
          config[
            "CricClubs Match URL"
          ] ||
          ""
        );

      if (details) {

        CLUB_ID =
          details.clubId;

        MATCH_ID =
          details.matchId;

        HAS_VALID_MATCH =
          true;
      }

      CURRENT_BACKGROUND =
        config[
          "Background"
        ] ||
        CURRENT_BACKGROUND;

      CUSTOM_BACKGROUND_URL =
        config[
          "Custom Background URL"
        ] ||
        CUSTOM_BACKGROUND_URL;

      applyBackground(
        CURRENT_BACKGROUND,
        CUSTOM_BACKGROUND_URL
      );
    }




    /* =========================================
       FOUR / SIX / WICKET ANIMATION DETECTION
       ========================================= */

    const SEEN_DELIVERY_KEYS = new Set();
    let BOUNDARY_BASELINE_READY = false;
    let BOUNDARY_ANIMATION_ACTIVE = false;
    let BOUNDARY_HIDE_TIMER = null;

    function deliveryKey(ball) {
      const createdAt = firstValue(ball, ["createdAt", "lastModifiedAt", "timestamp", "time"]);
      const over = firstValue(ball, ["over", "overNum", "overNumber"]);
      const delivery = firstValue(ball, ["ball", "ballNum", "ballNumber"]);
      const batsman = firstValue(ball, ["batsmanName", "strikerName", "batsman"]);
      const runs = firstValue(ball, ["runs", "runsScored", "runsDisplay"]);
      const commentary = firstValue(ball, ["commentary", "description"]);
      return [createdAt, over, delivery, batsman, runs, commentary].join("|");
    }

    function collectDeliveries(ballsData) {
      const deliveries = [];

      walk(ballsData, (obj) => {
        if (!obj || typeof obj !== "object" || Array.isArray(obj)) return;

        const hasBallShape =
          obj.createdAt !== undefined &&
          (
            obj.ball !== undefined ||
            obj.ballType !== undefined ||
            obj.batsmanName !== undefined ||
            obj.strikerName !== undefined ||
            obj.commentary !== undefined
          ) &&
          (
            obj.runs !== undefined ||
            obj.runsScored !== undefined ||
            obj.runsDisplay !== undefined
          );

        if (!hasBallShape) return;

        const rawRuns = firstValue(obj, ["runs", "runsScored", "runsDisplay"]);
        const runs = Number(String(rawRuns).replace(/[^0-9.-]/g, ""));
        if (!Number.isFinite(runs)) return;

        const commentary =
          String(
            firstValue(
              obj,
              [
                "commentary",
                "description"
              ]
            ) || ""
          );

        const explicitOut =
          obj.isOut === true ||
          String(obj.isOut).toLowerCase() === "true";

        const wicketFields =
          [
            obj.wicketTaker,
            obj.wicketTaker1,
            obj.wicketTaker2,
            obj.wicketType,
            obj.dismissalType,
            obj.outType
          ]
          .some(
            value =>
              value !== undefined &&
              value !== null &&
              String(value).trim() !== "" &&
              String(value).trim() !== "0"
          );

        const commentaryWicket =
          /\b(out|wicket|bowled|caught|run\s*out|stumped|lbw|hit\s*wicket)\b/i
            .test(commentary);

        /*
          STRICT BOUNDARY DETECTION

          Only a genuine FOUR or SIX off the bat
          may trigger the boundary animation.

          These must NOT trigger:
          - wide + 3 = 4
          - wide + 5 = 6
          - byes
          - leg byes
          - no-ball combinations
          - penalty/extras combinations
        */

        const numericValue = value => {
          if (
            value === undefined ||
            value === null ||
            String(value).trim() === ""
          ) {
            return 0;
          }

          const number =
            Number(value);

          return Number.isFinite(number)
            ? number
            : 0;
        };

        const wideRuns =
          numericValue(
            firstValue(
              obj,
              [
                "wides",
                "wide",
                "wideRuns",
                "wd",
                "w"
              ]
            )
          );

        const byeRuns =
          numericValue(
            firstValue(
              obj,
              [
                "byes",
                "bye",
                "byeRuns",
                "b"
              ]
            )
          );

        const legByeRuns =
          numericValue(
            firstValue(
              obj,
              [
                "legByes",
                "legBye",
                "legByeRuns",
                "lb"
              ]
            )
          );

        const noBallRuns =
          numericValue(
            firstValue(
              obj,
              [
                "noBalls",
                "noBall",
                "noBallRuns",
                "noballs",
                "nb"
              ]
            )
          );

        const penaltyRuns =
          numericValue(
            firstValue(
              obj,
              [
                "penaltyRuns",
                "penalty",
                "penalties"
              ]
            )
          );

        const extrasTotal =
          numericValue(
            firstValue(
              obj,
              [
                "extras",
                "extraRuns",
                "extrasRuns"
              ]
            )
          );

        const commentaryHasExtras =
          /\b(wide|wides|bye|byes|leg\s*bye|leg\s*byes|no[\s-]*ball|penalty)\b/i
            .test(commentary);

        const hasAnyExtras =
          wideRuns > 0 ||
          byeRuns > 0 ||
          legByeRuns > 0 ||
          noBallRuns > 0 ||
          penaltyRuns > 0 ||
          extrasTotal > 0 ||
          commentaryHasExtras;

        /*
          Prefer a dedicated batsman/batter-runs field
          if CricClubs supplies one.
        */
        const batterRunsRaw =
          firstValue(
            obj,
            [
              "batterRuns",
              "batsmanRuns",
              "batsmenRuns",
              "runsOffBat",
              "batRuns",
              "batterScore",
              "batsmanScore"
            ]
          );

        const hasExplicitBatterRuns =
          batterRunsRaw !== undefined &&
          batterRunsRaw !== null &&
          String(batterRunsRaw).trim() !== "";

        const batterRuns =
          hasExplicitBatterRuns
            ? numericValue(batterRunsRaw)
            : (
                hasAnyExtras
                  ? null
                  : runs
              );

        const genuineBoundary =
          !hasAnyExtras &&
          (
            batterRuns === 4 ||
            batterRuns === 6
          );

        deliveries.push({
          key: deliveryKey(obj),
          runs,
          batterRuns,
          hasAnyExtras,
          genuineBoundary,
          isWicket:
            explicitOut ||
            wicketFields ||
            commentaryWicket,
          createdAt: String(obj.createdAt || ""),
          raw: obj
        });
      });

      deliveries.sort((a, b) => {
        const ta = Date.parse(a.createdAt);
        const tb = Date.parse(b.createdAt);
        if (Number.isFinite(ta) && Number.isFinite(tb) && ta !== tb) return ta - tb;
        return a.key.localeCompare(b.key);
      });

      return deliveries;
    }


    function clearImpactRays() {
      const holder =
        document.getElementById(
          "impactRays"
        );

      if (holder) {
        holder.innerHTML =
          "";
      }
    }

    function buildImpactRays() {
      clearImpactRays();

      const holder =
        document.getElementById(
          "impactRays"
        );

      if (!holder) return;

      const count =
        34;

      for (
        let i = 0;
        i < count;
        i++
      ) {
        const ray =
          document.createElement(
            "span"
          );

        ray.className =
          "impact-ray" +
          (
            i % 5 === 0
              ? " maroon"
              : ""
          );

        const angle =
          (
            360 /
            count
          ) *
          i +
          (
            Math.random() *
            5 -
            2.5
          );

        const length =
          130 +
          Math.random() *
          115;

        ray.style.setProperty(
          "--a",
          `${angle}deg`
        );

        ray.style.setProperty(
          "--len",
          `${length}px`
        );

        ray.style.setProperty(
          "--delay",
          `${Math.random() * .06}s`
        );

        holder.appendChild(
          ray
        );
      }
    }


    function clearSixFireworks() {
      [
        "fwMain",
        "fwOne",
        "fwTwo",
        "fwThree",
        "fwFour"
      ]
      .forEach(
        id => {
          const holder =
            document.getElementById(
              id
            );

          if (holder) {
            holder.innerHTML =
              "";
          }
        }
      );
    }

    function addFireworkBurst(
      holderId,
      count,
      baseDistance,
      delayBase =
        0
    ) {
      const holder =
        document.getElementById(
          holderId
        );

      if (!holder) return;

      holder.innerHTML =
        "";

      for (
        let i = 0;
        i < count;
        i++
      ) {
        const spark =
          document.createElement(
            "span"
          );

        const colourClass =
          i % 3 === 1
            ? " maroon"
            : i % 3 === 2
              ? " white"
              : "";

        spark.className =
          "firework-spark" +
          colourClass +
          (
            i % 4 === 0
              ? " small"
              : ""
          );

        const angle =
          (
            360 /
            count
          ) *
          i +
          (
            Math.random() *
            7 -
            3.5
          );

        const distance =
          baseDistance *
          (
            .72 +
            Math.random() *
            .52
          );

        spark.style.setProperty(
          "--a",
          `${angle}deg`
        );

        spark.style.setProperty(
          "--d",
          `${distance}px`
        );

        spark.style.setProperty(
          "--delay",
          `${
            delayBase +
            Math.random() *
            .08
          }s`
        );

        holder.appendChild(
          spark
        );
      }

      const cometCount =
        Math.max(
          10,
          Math.round(
            count /
            4
          )
        );

      for (
        let i = 0;
        i < cometCount;
        i++
      ) {
        const comet =
          document.createElement(
            "span"
          );

        comet.className =
          "firework-comet";

        const angle =
          (
            360 /
            cometCount
          ) *
          i +
          (
            Math.random() *
            9 -
            4.5
          );

        const distance =
          baseDistance *
          (
            .72 +
            Math.random() *
            .34
          );

        comet.style.setProperty(
          "--a",
          `${angle}deg`
        );

        comet.style.setProperty(
          "--d",
          `${distance}px`
        );

        comet.style.setProperty(
          "--delay",
          `${
            delayBase +
            Math.random() *
            .05
          }s`
        );

        holder.appendChild(
          comet
        );
      }
    }

    function buildSixFireworks() {
      clearSixFireworks();

      /*
        Big central explosion.
      */
      addFireworkBurst(
        "fwMain",
        82,
        235,
        0
      );

      /*
        Staggered secondary
        explosions.
      */
      addFireworkBurst(
        "fwOne",
        32,
        96,
        .08
      );

      addFireworkBurst(
        "fwTwo",
        32,
        96,
        .12
      );

      addFireworkBurst(
        "fwThree",
        26,
        82,
        .17
      );

      addFireworkBurst(
        "fwFour",
        26,
        82,
        .20
      );
    }


    function clearWicketDebris() {
      const holder =
        document.getElementById(
          "wicketDebris"
        );

      if (holder) {
        holder.innerHTML =
          "";
      }
    }

    function buildWicketDebris() {
      clearWicketDebris();

      const holder =
        document.getElementById(
          "wicketDebris"
        );

      if (!holder) return;

      const count =
        34;

      for (
        let i = 0;
        i < count;
        i++
      ) {
        const chip =
          document.createElement(
            "span"
          );

        chip.className =
          "wicket-chip" +
          (
            i % 3 === 1
              ? " maroon"
              : i % 3 === 2
                ? " white"
                : ""
          );

        const angle =
          Math.random() *
          Math.PI *
          2;

        const distance =
          85 +
          Math.random() *
          145;

        chip.style.setProperty(
          "--x",
          `${
            Math.cos(angle) *
            distance
          }px`
        );

        chip.style.setProperty(
          "--y",
          `${
            Math.sin(angle) *
            distance *
            .66
          }px`
        );

        chip.style.setProperty(
          "--r",
          `${
            Math.random() *
            320 -
            160
          }deg`
        );

        chip.style.setProperty(
          "--delay",
          `${
            Math.random() *
            .08
          }s`
        );

        holder.appendChild(
          chip
        );
      }
    }


    function clearCelebrationEffects() {
      clearImpactRays();
      clearSixFireworks();
      clearWicketDebris();
    }


    function showCricketAnimation(
      type
    ) {
      if (
        type !== "FOUR" &&
        type !== "SIX" &&
        type !== "WICKET"
      ) {
        return;
      }

      const overlay =
        document.getElementById(
          "boundaryOverlay"
        );

      const word =
        document.getElementById(
          "boundaryWord"
        );

      if (
        !overlay ||
        !word
      ) {
        return;
      }

      if (
        BOUNDARY_HIDE_TIMER
      ) {
        clearTimeout(
          BOUNDARY_HIDE_TIMER
        );

        BOUNDARY_HIDE_TIMER =
          null;
      }

      BOUNDARY_ANIMATION_ACTIVE =
        true;

      /*
        Fully reset the last animation
        so consecutive events can still
        trigger correctly.
      */
      overlay.className =
        "boundary-overlay";

      word.textContent =
        "";

      clearCelebrationEffects();

      void overlay.offsetWidth;

      if (
        type === "FOUR"
      ) {
        word.textContent =
          "FOUR";

        buildImpactRays();

        overlay.classList.add(
          "show",
          "four"
        );
      }

      else if (
        type === "SIX"
      ) {
        word.textContent =
          "SIX";

        buildSixFireworks();

        overlay.classList.add(
          "show",
          "six"
        );
      }

      else {
        word.textContent =
          "WICKET";

        buildWicketDebris();

        overlay.classList.add(
          "show",
          "wicket"
        );
      }

      /*
        All approved animations
        last 3.5 seconds.
      */
      BOUNDARY_HIDE_TIMER =
        setTimeout(
          () => {
            overlay.className =
              "boundary-overlay";

            word.textContent =
              "";

            clearCelebrationEffects();

            BOUNDARY_ANIMATION_ACTIVE =
              false;
          },
          3500
        );
    }


    function showBoundaryAnimation(
      runs
    ) {
      if (
        runs === 4
      ) {
        showCricketAnimation(
          "FOUR"
        );
      }

      else if (
        runs === 6
      ) {
        showCricketAnimation(
          "SIX"
        );
      }
    }


    function processBoundaryAnimations(
      ballsData
    ) {
      const deliveries =
        collectDeliveries(
          ballsData
        );

      if (
        !deliveries.length
      ) {
        return;
      }

      /*
        First load creates a baseline.
        This prevents an old FOUR,
        SIX or WICKET from playing
        immediately when the page opens.
      */
      if (
        !BOUNDARY_BASELINE_READY
      ) {
        for (
          const delivery
          of deliveries
        ) {
          SEEN_DELIVERY_KEYS.add(
            delivery.key
          );
        }

        BOUNDARY_BASELINE_READY =
          true;

        return;
      }

      const unseen =
        deliveries.filter(
          delivery =>
            !SEEN_DELIVERY_KEYS.has(
              delivery.key
            )
        );

      for (
        const delivery
        of deliveries
      ) {
        SEEN_DELIVERY_KEYS.add(
          delivery.key
        );
      }

      /*
        Prevent the set from
        growing forever.
      */
      while (
        SEEN_DELIVERY_KEYS.size >
        300
      ) {
        const oldest =
          SEEN_DELIVERY_KEYS
            .values()
            .next()
            .value;

        SEEN_DELIVERY_KEYS.delete(
          oldest
        );
      }

      if (
        !unseen.length
      ) {
        return;
      }

      /*
        Use the latest unseen
        scoring event only.

        WICKET takes priority
        over a boundary on the
        same delivery.
      */
      const latestEvent =
        [
          ...unseen
        ]
        .reverse()
        .find(
          delivery =>
            delivery.isWicket ||
            delivery.genuineBoundary
        );

      if (
        !latestEvent
      ) {
        return;
      }

      if (
        latestEvent.isWicket
      ) {
        showCricketAnimation(
          "WICKET"
        );

        return;
      }

      /*
        Only a delivery that passed the strict
        genuine-boundary test reaches this point.
      */
      showBoundaryAnimation(
        latestEvent.batterRuns
      );
    }


    async function loadScore() {

      if (
        !HAS_VALID_MATCH ||
        !CLUB_ID ||
        !MATCH_ID
      ) {
        return;
      }

      try {

        const [
          scoreResponse,
          ballsResponse
        ] =
          await Promise.all(
            [
              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              ),

              fetch(
                `/api/${CLUB_ID}/${MATCH_ID}/balls?t=${Date.now()}`,
                {
                  cache:
                    "no-store"
                }
              )
            ]
          );

        if (!scoreResponse.ok) {

          throw new Error(
            `Score HTTP ${scoreResponse.status}`
          );
        }

        if (!ballsResponse.ok) {

          throw new Error(
            `Balls HTTP ${ballsResponse.status}`
          );
        }

        const scoreData =
          await scoreResponse.json();

        const ballsData =
          await ballsResponse.json();


        processBoundaryAnimations(
          ballsData
        );

        const teams =
          buildTeams(
            scoreData
          );

        if (
          teams.length < 2
        ) {
          return;
        }

        const team1 =
          teams[0];

        const team2 =
          teams[1];

        document.getElementById(
          "mainTitle"
        ).textContent =
          "2026 Trinity Games";

        document.getElementById(
          "competitionTitle"
        ).textContent =
          findCompetitionTitle(
            scoreData
          );

        document.getElementById(
          "team1Name"
        ).textContent =
          team1.teamName ||
          "TEAM 1";

        document.getElementById(
          "team2Name"
        ).textContent =
          team2.teamName ||
          "TEAM 2";

        document.getElementById(
          "team1Score"
        ).textContent =
          formatScore(
            team1
          );

        document.getElementById(
          "team2Score"
        ).textContent =
          formatScore(
            team2
          );

        document.getElementById(
          "team1Overs"
        ).textContent =
          formatOvers(
            team1
          );

        document.getElementById(
          "team2Overs"
        ).textContent =
          formatOvers(
            team2
          );

        document.getElementById(
          "status"
        ).textContent =
          getBottomText(
            scoreData,
            ballsData
          );

      }

      catch (error) {

        console.error(
          "Score error:",
          error
        );
      }
    }


    async function updateScoreboard() {

      try {

        await loadConfig();

      }

      catch (error) {

        console.error(
          "Config error:",
          error
        );
      }

      await loadScore();
    }


    updateScoreboard();


    setInterval(
      updateScoreboard,
      UPDATE_INTERVAL_MS
    );

  </script>
